<style>

.auth-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 70px #0007}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-contrast);font-weight:800}.brand b{display:block;font-size:16px}.brand small{color:var(--muted)}h1{font-size:28px;margin:28px 0 8px}h2{font-size:20px;margin:0}h3{margin:0 0 10px}.sub{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:650}.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;color:var(--ink);outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #0f8f8520}textarea.input{min-height:92px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-contrast);font-weight:700}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#edf2f5;color:var(--ink)}.btn.ghost{background:transparent;color:var(--accent-text);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--danger)}.wide{width:100%}.switch-auth{text-align:center;margin-top:16px}.link,a{border:0;background:none;color:var(--accent-text);font-weight:700}.message{min-height:20px;margin-top:12px;color:var(--danger)}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--side);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.sidebar .brand{padding:0 7px 25px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8c3d2;text-align:left;padding:12px 14px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.nav .admin-only{color:#92e4da}.profile{margin-top:auto;border-top:1px solid #ffffff18;padding:18px 7px 0;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d7f2ee;color:#08756d;font-weight:800}.profile b,.profile small{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile small{color:#91a0b6;margin-top:2px}.main{min-width:0;padding:34px clamp(20px,4vw,56px) 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.top h1{margin:0 0 8px}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:30px;font-weight:800;margin:12px 0 4px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800;color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--accent2);color:#08756d;font-weight:750;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;color:var(--muted);font-size:12px;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:14px 12px;border-bo .chat-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.chat-side .choice{width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:9px}.chat-side .choice.active{border-color:var(--accent);background:var(--accent2)}.messages{height:430px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}.bubble{max-width:82%;padding:12px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:var(--accent);color:var(--accent-contrast);border-bottom-right-radius:4px}.bubble.bot{align-self:flex-start;background:#edf2f5;border-bottom-left-radius:4px}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.composer textarea{min-height:52px;max-height:140px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;color:var(--muted)}
.calc-rows{display:grid;gap:8px}.calc-row{display:grid;grid-template-columns:1fr 130px 120px 40px;gap:8px}.result{background:linear-gradient(135deg,#0c8178,#135f72);color:#fff}.result .metric{font-size:42px}.modal{position:fixed;inset:0;background:#06101dbb;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:35px;height:35px}.notice{border-left:4px solid var(--accent);background:var(--accent2);color:var(--ink);padding:12px 14px;border-radius:8px;line-height:1.5}.danger-text{color:var(--danger)}
.sidebar{background:var(--side);color:var(--side-ink);border-right:1px solid var(--line)}.nav button{color:var(--muted)}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}.nav .admin-only{color:var(--accent)}.profile{border-color:var(--line)}.profile small{color:var(--muted)}.avatar{background:var(--accent2);color:var(--accent)}.pill{color:var(--accent)}
body[data-theme="light"]{--ink:#1f2937;--muted:#596579;--bg:#f0f1f1;--card:#fff;--line:#dce2e8;--side:#fff;--side-ink:#1f2937;--shadow:0 14px 34px rgba(22,35,57,.09)}body[data-theme="dark"]{--ink:#f7f9fc;--muted:#b9c4d4;--bg:#121926;--card:#111a2a;--line:#52637c;--side:#111a2a;--side-ink:#fff;--danger:#ff8b8b;--shadow:0 16px 38px rgba(0,0,0,.24)}body[data-theme="reading"]{--ink:#2f352f;--muted:#625e55;--bg:#cac6bc;--card:#fffaf0;--line:#c9bfaa;--side:#fffaf0;--side-ink:#2f352f;--shadow:0 14px 34px rgba(84,69,43,.12)}body{transition:background-color .2s,color .2s}body[data-theme="dark"] .input,body[data-theme="dark"] .choice,body[data-theme="dark"] .quick button,body[data-theme="dark"] .accent-card,body[data-theme="dark"] .mode-card{background:#101b2d;color:var(--ink);border-color:var(--line)}body[data-theme="dark"] .btn.secondary{background:#2b3b55;color:#f7f9fc}body[data-theme="dark"] .btn.danger{background:#3a2028;color:#ffb4b4}body[data-theme="dark"] .bubble.bot{background:#243249;color:#f7f9fc}body[data-theme="dark"] .pill{color:#f7f9fc}body[data-theme="dark"] .table th,body[data-theme="dark"] .table td{color:var(--ink)}body[data-theme="reading"] .btn.secondary{background:#e7ddcd;color:var(--ink)}body[data-theme="reading"] .bubble.bot{background:#e7ddcd}.section-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.section-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:9px}.section-tabs button.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}.details-grid{display:grid;gap:10px}.details-row{border:1px solid var(--line);border-radius:10px;padding:12px}.confirm-box{border:1px solid var(--accent);background:var(--accent2);color:var(--ink);border-radius:12px;padding:14px;margin-top:12px}.student-directory{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.student-card{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;text-align:left}.student-card:hover,.student-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.query-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.query-chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px}.query-chips button.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.appearance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode-card,.accent-card{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px;text-align:left}.mode-card.active,.accent-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.mode-preview{height:52px;border-radius:8px;margin-bottom:9px;border:1px solid #0001}.mode-preview.light{background:linear-gradient(90deg,#fff 0 30%,#f1f5f9 30%)}.mode-preview.dark{background:linear-gradient(90deg,#111a2a 0 30%,#0f1725 30%)}.mode-preview.reading{background:linear-gradient(90deg,#fffaf0 0 30%,#f3ede2 30%)}.accent-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.accent-card{text-align:center;padding:10px 4px}.swatch{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin:0 auto 7px;color:#fff;font-weight:800}.settings-section{margin-bottom:18px}.settings-section h2{margin-bottom:7px}.settings-tabs{display:flex;gap:8px;margin:14px 0}.settings-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px}.settings-tabs button.active{background:var(--accent2);color:var(--accent);border-color:var(--accent)}.hue-preview{height:76px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.range{width:100%;accent-color:var(--accent)}
body[data-theme="reading"]{--muted:#4f4b43}.section-tabs button.active,.settings-tabs button.active,.query-chips button.active,.nav button.active,.nav button:hover,.nav .admin-only,.avatar,.pill{color:var(--accent-text)}.hue-preview{color:var(--accent-contrast)}
@media(max-width:1000px){.span3{grid-column:span 6}.span4,.span5,.span7,.span8{grid-column:span 12}.chat-layout{grid-template-columns:1fr}.chat-side{display:flex;gap:8px}.chat-side .choice{margin:0}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:14px}.sidebar .brand{padding-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.profile{display:none}.main{padding:22px 14px 40px}.top{display:block}.top .actions{margin-top:14px}.span3{grid-column:span 12}.calc-row{grid-template-columns:1fr 85px 75px 40px}.composer{grid-template-columns:1fr}.table{min-width:620px}.appearance-grid{grid-template-columns:1fr}.accent-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand"><div class="logo">SP</div><div><b>Student Performance</b><small>Prediction System</small></div></div><h1 id="authTitle">Вход</h1><p class="sub" id="authSub">Откройте личные академические данные и инструменты анализа.</p><div id="nameField" class="field hidden"><label>Имя</label><input id="fullName" class="input" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="username"></div><div class="field"><label>Пароль</label><input id="password" class="input" type="password" autocomplete="current-password"><small id="passwordHint" class="sub hidden">Для регистрации — не менее 8 символов.</small></div><button id="authSubmit" class="btn wide">Войти</button><div id="authMessage" class="message" role="status"></div><div class="switch-auth"><span id="switchText">Нет аккаунта?</span> <button id="switchAuth" class="link">Зарегистрироваться</button></div></div></section>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><div class="logo">SP</div><div><b>Student Performance</b><small>Prediction System</small></div></div><nav id="nav" class="nav"><button data-view="dashboard" class="active student-only">Обзор</button><button data-view="academics" class="student-only">Академические данные</button><button data-view="assistant" class="student-only">Помощник</button><button data-view="calculator">Калькулятор</button><button data-view="history" class="student-only">История</button><button data-view="admin" class="admin-only hidden">Режим администратора</button><button data-view="settings">Настройки</button></nav><div class="profile"><div id="avatar" class="avatar">—</div><div><b id="profileName">Студент</b><small id="profileRole">Личный профиль</small></div></div></aside><main id="content" class="main"></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const DEFAULT_PREFS={language:'ru',display_mode:'light',accent_color:'#2563EB'};
const state={token:sessionStorage.getItem('sp_token')||'',me:null,data:null,view:'dashboard',register:false,assistantMode:'basic',messages:[],prefs:{...DEFAULT_PREFS},accentTab:'preset',accentSource:localStorage.getItem('sp_accent_source')||'preset'};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{})});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function nameOf(){return state.data?.students?.[0]?.full_name||state.me?.display_name||state.me?.email||'Студент'}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function validAccent(v){return /^#[0-9a-f]{6}$/i.test(v||'')?v.toUpperCase():DEFAULT_PREFS.accent_color}
function hexFade(hex){const h=validAccent(hex);return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},.14)`}
const FIGMA_ACCENTS={light:{'#2563EB':'#2563EB','#7C3AED':'#7C3AED','#8B5CF6':'#8B5CF6','#DB2777':'#DB2777','#DC2626':'#DC2626','#EA580C':'#EA580C','#CA8A04':'#CA8A04','#16A34A':'#16A34A','#0D9488':'#0D9488','#0891B2':'#0891B2'},dark:{'#2563EB':'#60A5FA','#7C3AED':'#A78BFA','#8B5CF6':'#C084FC','#DB2777':'#F472B6','#DC2626':'#F87171','#EA580C':'#FB923C','#CA8A04':'#FACC15','#16A34A':'#4ADE80','#0D9488':'#2DD4BF','#0891B2':'#22D3EE'},reading:{'#2563EB':'#4F6F8F','#7C3AED':'#76658A','#8B5CF6':'#806A91','#DB2777':'#9B6577','#DC2626':'#A65D57','#EA580C':'#A86F45','#CA8A04':'#9A7B32','#16A34A':'#5F7F62','#0D9488':'#4F8078','#0891B2':'#4F7F8A'}};
const LEGACY_ACCENTS={'#4F6F8F':'#2563EB','#76658A':'#7C3AED','#806A91':'#8B5CF6','#9B6577':'#DB2777','#A65D57':'#DC2626','#A86F45':'#EA580C','#9A7B32':'#CA8A04','#5F7F62':'#16A34A','#4F8078':'#0D9488','#4F7F8A':'#0891B2'};
function presetAccent(base,mode){return FIGMA_ACCENTS[mode]?.[base]||base}function appliedAccent(base,mode){return state.accentSource==='custom'?base:presetAccent(base,mode)}
function contrastText(hex){const c=hex.replace('#',''),rgb=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16)/255),linear=rgb.map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4),l=.2126*linear[0]+.7152*linear[1]+.0722*linear[2];return (l+.05)/.05>(1.05)/(l+.05)?'#000000':'#FFFFFF'}
function applyAppearance(){state.prefs={...DEFAULT_PREFS,...state.prefs,accent_color:validAccent(state.prefs.accent_color)};if(LEGACY_ACCENTS[state.prefs.accent_color]){state.prefs.accent_color=LEGACY_ACCENTS[state.prefs.accent_color];state.accentSource='preset';localStorage.setItem('sp_accent_source','preset')}const mode=['light','dark','reading'].includes(state.prefs.display_mode)?state.prefs.display_mode:'light',accent=appliedAccent(state.prefs.accent_color,mode),hue=hexHue(state.prefs.accent_color),accentText=mode==='dark'?`hsl(${hue} 82% 76%)`:`hsl(${hue} 68% 28%)`;document.body.dataset.theme=mode;document.documentElement.style.colorScheme=mode==='dark'?'dark':'light';document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent2',hexFade(accent));document.documentElement.style.setProperty('--accent-contrast',contrastText(accent));document.documentElement.style.setProperty('--accent-text',accentText);document.documentElement.lang=state.prefs.language}
function hueToHex(h){const s=.3,l=.43,a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hexHue(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(!d)return 0;let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}
async function bootstrap(){if(!state.token){applyAppearance();return showAuth()}try{state.me=await api('/me');[state.data,state.prefs]=await Promise.all([api('/data'),api('/preferences')]);state.prefs={...DEFAULT_PREFS,...state.prefs};applyAppearance();$('#profileName').textContent=nameOf();$('#avatar').textContent=initials(nameOf());$('#profileRole').textContent=state.me.role==='admin'?'Администратор':'Личный профиль';$('.admin-only').classList.toggle('hidden',state.me.role!=='admin');document.querySelectorAll('.student-only').forEach(x=>x.classList.toggle('hidden',state.me.role==='admin'));if(state.me.role==='admin'&&!['admin','calculator','settings'].includes(state.view))state.view='admin';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('sp_token');state.token='';showAuth(e.message)}}
function showAuth(message=''){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');$('#authMessage').textContent=message}
$('#switchAuth').onclick=()=>{state.register=!state.register;$('#nameField').classList.toggle('hidden',!state.register);$('#passwordHint').classList.toggle('hidden',!state.register);$('#password').autocomplete=state.register?'new-password':'current-password';$('#authTitle').textContent=state.register?'Регистрация':'Вход';$('#authSubmit').textContent=state.register?'Создать аккаунт':'Войти';$('#switchText').textContent=state.register?'Уже есть аккаунт?':'Нет аккаунта?';$('#switchAuth').textContent=state.register?'Войти':'Зарегистрироваться'};
$('#authSubmit').onclick=async()=>{try{$('#authMessage').textContent='';const body={email:$('#email').value.trim(),password:$('#password').value};if(!body.email)throw Error('Введите email или логин');if(state.register){if(!/^\S+@\S+\.\S+$/.test(body.email))throw Error('Введите корректный email');body.full_name=$('#fullName').value.trim();if(!body.full_name)throw Error('Укажите имя');if(body.password.length<8)throw Error('Пароль должен содержать минимум 8 символов')}const raw=await api(state.register?'/auth/register':'/auth/login','POST',body),d=Array.isArray(raw)?raw[0]:raw;if(!d?.session_token)throw Error('Сервер не вернул токен сессии');state.token=d.session_token;sessionStorage.setItem('sp_token',state.token);$('#password').value='';await bootstrap()}catch(e){$('#authMessage').textContent=e.message}};
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function setPage(title,sub,actions='',html=''){$('#content').innerHTML=`<header class="top"><div><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div><div class="actions">${actions}</div></header>${html}`}
function rows(key){return Array.isArray(state.data?.[key])?state.data[key]:[]}function courseName(id){return rows('courses').find(x=>x.course_id==id)?.course_name||rows('courses').find(x=>x.course_id==id)?.name||`Курс #${id}`}function periodName(id){const p=rows('academic_periods').find(x=>x.period_id==id);return p?.period_name||p?.name||`Период ${p?.period_number||id}`}
function activePeriod(){return rows('academic_periods').find(x=>x.status==='active')||rows('academic_periods')[0]}function activeResults(){const p=activePeriod();return rows('academic_performance').filter(x=>!p||x.period_id==p.period_id)}
function weighted(rs){let sum=0,w=0;for(const r of rs){if(r.current_grade!=null&&+r.credits>0){sum+=+r.current_grade*+r.credits;w+=+r.credits}}return w?sum/w:null}

async function ask(q){const input=$('#prompt'),text=q||(input?.value||'').trim();if(!text)return;state.messages.push({who:'user',text});if(input)input.value='';state.messages.push({who:'bot',text:'Выполняю…'});assistant();try{const answer=state.assistantMode==='ai'?await aiAsk(text):await basicAsk(text);state.messages[state.messages.length-1]={who:'bot',text:answer}}catch(e){state.messages[state.messages.length-1]={who:'bot',text:'Не удалось выполнить: '+e.message}}assistant()}
async function basicAsk(text){const t=text.toLowerCase(),rs=activeResults(),avg=weighted(rs);if(/прогноз/.test(t)){const p=activePeriod();if(!p)return 'Сначала добавьте активный учебный период.';const r=await api('/predict','POST',{period_id:p.period_id,level:'period',save:false});return `Иллюстративный прогноз на текущий период: ${r.average??'нет данных'}. Метод: ${r.method_version||r.method||'консервативная базовая модель'}.`}if(/посещ/.test(t)){let held=0,att=0,exc=0;rs.forEach(x=>{held+=+x.lessons_held||0;att+=+x.lessons_attended||0;exc+=+x.lessons_excused||0});return held?`Зачтено ${att+exc} из ${held} занятий — ${((att+exc)/held*100).toFixed(1)}%. Фактически посещено: ${att}, уважительно пропущено: ${exc}.`:'Для расчёта посещаемости пока недостаточно данных.'}if(/кредит|нагруз|час|урок/.test(t)){const totals={};rs.forEach(x=>{const u=x.workload_unit||'credits',v=x.workload_value??x.credits;if(v!=null)totals[u]=(totals[u]||0)+Number(v)});return 'Учебная нагрузка: '+(Object.entries(totals).map(([u,v])=>`${v} ${{credits:'кредитов',academic_hours:'академических часов',lessons:'уроков'}[u]||u}`).join(', ')||'не указана')+'.'}if(/средн|оцен|балл/.test(t))return avg==null?'Нет оценок для расчёта.':`Средний балл за текущий период: ${avg.toFixed(1)}. Предметов: ${rs.length}.`;if(/предмет|курс/.test(t))return rs.length?rs.map(x=>`${courseName(x.course_id)} — ${x.current_grade??'без оценки'}`).join('\n'):'Предметов пока нет.';if(/кальк/.test(t)){go('calculator');return 'Открыл академический калькулятор.'}return 'Без ИИ я понимаю команды о среднем балле, оценках, предметах, учебной нагрузке, посещаемости, прогнозе и калькуляторе.'}
function describeAction(a){const d=a?.data||a?.draft||{};if(a?.operation==='clarify')return 'Нужно уточнить: '+(a.questions||[]).join(' ');if(a?.operation==='import_profile'){const subjects=d.subjects||[];return `Импорт профиля: ${d.setup?.institution_name||'школа'}, ${d.setup?.program_name||'класс'}, ${d.setup?.start_year||'год'}, 4 периода; предметов: ${subjects.length}.\\n`+subjects.map(x=>`• ${x.course_name}: итоговая ${x.grade_text||x.current_grade||'—'}`).join('\\n')};if(a?.operation==='create_subject')return `Добавить предмет «${d.course_name||'без названия'}»: нагрузка ${d.workload_value??d.credits??'не указана'} ${d.workload_unit||'не указана'}, оценка ${d.current_grade??'не указана'}, посещаемость ${d.attendance??'не указана'}%`;if(a?.operation==='write')return `Изменить ${a.entity}: ${Object.entries(d).map(([k,v])=>`${k}=${v}`).join(', ')}`;return `Выполнить ${a?.operation||'действие'}`}
function formatAIResult(x){if(x.status==='clarification_required')return 'Нужно уточнить перед сохранением:\n'+(x.questions||[]).map((q,i)=>`${i+1}. ${q}`).join('\n')+'\n\nЧерновик: '+describeAction({operation:'create_subject',draft:x.draft||{}});if(x.status!=='ok')return x.status==='skipped_after_failure'?'Следующий шаг пропущен из-за предыдущей ошибки.':`Не удалось выполнить шаг ${(x.index??0)+1}: ${x.detail||x.status}`;const r=x.result||{};if(r.text)return r.text;if(x.operation==='predict')return `Прогноз (${r.level||'period'}): средний балл ${r.average??'—'}, GPA ${r.gpa??'—'}. Метод: ${r.method_version||r.method||'базовая модель'}. Предметов: ${(r.subjects||[]).length}.`;if(x.operation==='calculate')return `Расчёт ${r.mode||''}: ${r.gpa!=null?'GPA '+r.gpa:r.average!=null?'средний балл '+r.average:r.attendance!=null?'посещаемость '+r.attendance+'%':'готово'}.`;if(x.operation==='read'){const items=r.items||[];return items.length?`Найдено записей: ${r.total??items.length}.\n`+items.slice(0,20).map(v=>v.course_id?`${courseName(v.course_id)} — оценка ${v.current_grade??'—'}, ${v.credits??'—'} кр.`:JSON.stringify(v)).join('\n'):'Записей не найдено.'}if(x.operation==='create_subject')return 'Предмет и его академические данные сохранены.';if(x.operation==='import_profile')return `Профиль сохранён: создано ${r.created??0} предметов и учебный период. Теперь данные доступны в разделе «Академические данные».`;if(x.operation==='write')return 'Изменения сохранены.';return JSON.stringify(r,null,2)}
async function aiAsk(text){const message=window.aiDraftContext?('Предыдущий черновик данных: '+JSON.stringify(window.aiDraftContext)+'\nОтвет пользователя на уточнение: '+text):text;const d=await api('/ai/chat','POST',{message});const completed=formatAI(d);if(d.status==='clarification_required'){window.aiDraftContext=d.draft_context||null;return completed+'\n\nОтветьте на вопросы выше одним сообщением.'}if(d.status==='confirmation_required'){window.aiDraftContext=null;window.pendingConfirmation=d.confirmation_token;window.pendingActions=d.proposed_actions;const note=`Проверьте каждое поле. Ожидает подтверждения: ${d.proposed_actions.length} изменение(я).`;return completed&&completed!=='Запрос выполнен.'?completed+'\\n\\n'+note:note}window.aiDraftContext=null;return completed}function formatAI(d){return (d.results||[]).map(formatAIResult).join('\n\n')||'Запрос выполнен.'}

function calculator(){if(!['gpa','course','attendance'].includes(window.calcMode))window.calcMode='gpa';const modes=[['gpa','Средний GPA'],['course','GPA дисциплины'],['attendance','Посещаемость']];setPage('Академический калькулятор','Каждый расчёт выполняется отдельно и не смешивает пустые поля с нулями.',state.me?.role==='admin'?'':`<button class="btn secondary" onclick="loadSavedCalc()">Взять текущие данные</button>`,`<div class="section-tabs">${modes.map(([v,n])=>`<button class="${window.calcMode===v?'active':''}" onclick="window.calcMode='${v}';calculator()">${n}</button>`).join('')}</div><div class="grid"><div class="card span8"><div class="field"><label>Учебный календарь</label><select id="calcCalendar" class="input"><option value="trimester">Триместр</option><option value="semester">Семестр</option><option value="quarter">Четверть</option><option value="annual">Год</option><option value="other">Другой</option></select></div>${window.calcMode==='attendance'?`<div class="grid"><div class="field span4"><label>Всего проведено</label><input id="lessonsTotal" class="input" type="number" min="1"></div><div class="field span4"><label>Посещено</label><input id="lessonsAttended" class="input" type="number" min="0"></div><div class="field span4"><label>Уважительные пропуски</label><input id="lessonsExcused" class="input" type="number" min="0"></div></div>`:`<div class="field"><label>Единица учебной нагрузки</label><select id="calcWorkloadUnit" class="input"><option value="credits">Кредиты</option><option value="academic_hours">Академические часы</option><option value="lessons">Уроки / занятия</option></select></div><h3>${window.calcMode==='course'?'Одна дисциплина':'Оценки и нагрузка'}</h3><div id="calcRows" class="calc-rows"></div>${window.calcMode==='course'?'':`<button class="btn secondary" style="margin-top:10px" onclick="addCalcRow()">+ Добавить строку</button>`}<p class="sub">Пустая оценка или нагрузка считаются ошибкой. Разные единицы нельзя смешивать без преобр function history(){const ps=rows('predictions');setPage('История прогнозов','Сохранённый результат, дата, метод и предметы из неизменяемого снимка расчёта.','',`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Уровень</th><th>Период</th><th>Прогноз</th><th>Метод</th><th>Предметы</th></tr></thead><tbody>${ps.map(p=>{const s=p.result_snapshot||{};return `<tr onclick='predictionDetails(${JSON.stringify(p)})' style="cursor:pointer"><td>${esc((p.created_at||p.prediction_date||'—').toString().replace('T',' ').slice(0,16))}</td><td>${esc(p.forecast_level||s.level||'period')}</td><td>${esc(periodName(p.period_id))}</td><td><span class="pill">${esc(s.average??p.predicted_gpa??'—')}</span></td><td>${esc(p.method_version||s.method_version||'—')}</td><td>${esc((s.subjects||[]).length)}</td></tr>`}).join('')}</tbody></table>${ps.length?'':'<div class="empty">Пока нет сохранённых прогнозов.</div>'}</div></div>`)}
function predictionDetails(p){const r=p.result_snapshot||p,subjects=r.subjects||[];modal('Подробности прогноза',predictionHtml(r)+`<p class="sub">Сохранено: ${esc(p.created_at||'—')}</p>`)}
function predictionHtml(r){const subjects=r.subjects||[];return `<div class="notice">Иллюстративная базовая модель, не гарантия результата.</div><div class="metric">${esc(r.average??'—')}</div><p><b>Уровень:</b> ${esc(r.level||'period')} · <b>Метод:</b> ${esc(r.method_version||'—')}</p><p><b>Покрытие:</b> ${esc(JSON.stringify(r.coverage||{}))}</p><div class="details-grid">${subjects.map(s=>`<div class="details-row"><b>${esc(courseName(s.course_id))}</b><span class="pill" style="float:right">${esc(Number(s.grade).toFixed(2))}</span><p class="sub">Исходная оценка: ${esc(s.current_grade)} · кредиты: ${esc(s.credits)}</p>${(s.signals||[]).length?`<p class="danger-text">Факторы риска: ${esc(s.signals.join(' · '))}</p>`:'<p class="sub">Явных факторов риска не выявлено.</p>'}${(s.exams||[]).map(e=>`<p>${esc(e.name)}: ${esc(e.estimated_grade)}</p>`).join('')}</div>`).join('')}</div>`}
function makePrediction(){const p=activePeriod();if(!p)return alert('Сначала добавьте активный учебный период');modal('Новый прогноз',`<div class="field"><label>Уровень прогноза</label><select id="forecastLevel" class="input"><option value="period">Текущий период</option><option value="year">Учебный год</option><option value="program">Вся программа</option></select></div><p class="sub">Годовой прогноз требует минимум 2/3 периодов, программный — достаточного числа завершённых лет.</p><button class="btn wide" onclick="runPrediction()">Рассчитать и сохранить</button><div id="modalMsg" class="message"></div>`)}
async function runPrediction(){const p=activePeriod();try{const r=await api('/predict','POST',{period_id:p.period_id,level:$('#forecastLevel').value,save:true});$('#modalBody').innerHTML=predictionHtml(r)+`<button class="btn wide" onclick="closeModal();refresh()">Готово</button>`}catch(e){$('#modalMsg').textContent=e.message}}
function admin(){if(state.me?.role!=='admin')return go('dashboard');setPage('Режим администратора','Каталог студентов, готовые запросы и безопасный просмотр академических данных.','',`<div class="grid"><div class="card span12"><div class="actions"><div style="flex:1"><h2>Студенты</h2><p class="sub">Выберите готовый запрос или откройте карточку конкретного студента.</p></div><div class="field" style="margin:0;min-width:240px"><label>Быстрый поиск</label><input id="studentSearch" class="input" placeholder="Имя, email или группа" oninput="renderAdminStudents()"></div></div><div class="query-chips"><button data-filter="all" class="active" onclick="adminFilter('all',this)">Все студенты</button><button data-filter="graded" onclick="adminFilter('graded',this)">С оценками</button><button data-filter="missing" onclick="adminFilter('missing',this)">Без оценок</button><button data-filter="predictions" onclick="adminFilter('predictions',this)">С прогнозами</button></div><div id="studentDirectory" class="student-directory"><div class="empty">Загрузка студентов…</div></div></div><div class="card span7"><h2>Карточка студента</h2><p class="sub">Оценки, периоды и прогнозы выбранного профиля без ручного поиска по таблицам.</p><div id="studentDetails" class="empty">Выберите студента из каталога.</div></div><div class="card span5"><h2>Общий GPA</h2><p class="sub">Сравниваются студенты с одинаковой фактической системой оценивания.</p><button class="btn wide" onclick="adminGpa()">Рассчитать по всем студентам</button><div id="adminGpaResult" class="empty">—</div></div><div class="card span12"><details><summary><b>Расширенный просмотр таблиц</b> <span class="sub">для демонстрации структуры базы</span></summary><div class="toolbar" style="margin-top:12px"><div class="field"><label>Набор данных</label><select id="adminEntity" class="input">${[['students','Студенты'],['academic_performance','Оценки'],['academic_periods','Учебные периоды'],['academic_years','Учебные годы'],['study_programs','Программы'],['predictions','Прогнозы'],['courses','Курсы'],['grading_scales','Шкалы GPA'],['grading_bands','Диапазоны шкал'],['assessment_components','Компоненты работ'],['assessments','Работы'],['assessment_results','Результаты работ']].map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></div><div class="field"><label>Фильтр</label><input id="adminQuery" class="input" placeholder="Любое значение"></div><button class="btn" onclick="adminSearch()">Показать</button></div><div id="adminResults" class="empty">Выберите набор данных.</div></details></div><div class="card span12"><h2>Административный помощник</h2><p class="sub">Понимает запросы по всем разрешённым учебным таблицам и общему GPA.</p><textarea id="adminPrompt" class="input" placeholder="Например: покажи всех студентов или посчитай средний GPA"></textarea><button class="btn" style="margin-top:10px" onclick="adminAsk()">Отправить</button><div id="adminAnswer" class="empty">—</div></div></div>`);adminLoadStudents()}
async function adminLoadStudents(){try{const [s,r,p,g]=await Promise.all([api('/admin/tables/students?limit=100'),api('/admin/tables/academic_performance?limit=100'),api('/admin/tables/predictions?limit=100'),api('/admin/analytics/comparable-gpa')]);const records=r.items||[],predictions=p.items||[],gpas=new Map((g.groups||[]).flatMap(x=>(x.students||[]).map(y=>[y.student_id,y.gpa])));window.adminStudents=(s.items||[]).filter(x=>x.student_id!==state.me.student_id).map(x=>({...x,records:records.filter(r=>r.student_id===x.student_id).length,predictions:predictions.filter(p=>p.student_id===x.student_id).length,gpa:gpas.get(x.student_id)}));window.adminStudentFilter='all';renderAdminStudents()}catch(e){$('#studentDirectory').innerHTML=`<div class="danger-text">${esc(e.message)}</div>`}}
function adminFilter(v,button){window.adminStudentFilter=v;document.querySelectorAll('.query-chips button').forEach(x=>x.classList.toggle('active',x===button));renderAdminStudents()}
function renderAdminStudents(){const q=($('#studentSearch')?.value||'').trim().toLowerCase(),filter=window.adminStudentFilter||'all';let list=(window.adminStudents||[]).filter(x=>!q||`${x.full_name} ${x.email} ${x.group_name}`.toLowerCase().includes(q));if(filter==='graded')list=list.filter(x=>x.records);if(filter==='missing')list=list.filter(x=>!x.records);if(filter==='predictions')list=list.filter(x=>x.predictions);$('#studentDirectory').innerHTML=list.map(x=>`<button class="student-card ${window.adminSelectedStudent===x.student_id?'active':''}" onclick="adminStudent(${x.student_id})"><b>${esc(x.full_name||'Без имени')}</b><div class="sub">${esc(x.email||'—')} · ${esc(x.group_name||'без группы')}</div><div style="margin-top:8px"><span class="pill">${x.records} оценок</span> <span class="pill">GPA ${esc(x.gpa??'—')}</span></div></button>`).join('')||'<div class="empty">По этому запросу студентов нет.</div>';if(state.prefs.language!=='ru')applyLanguage()}
async function adminStudent(id){window.adminSelectedStudent=id;renderAdminStudents();const box=$('#studentDetails');box.textContent='Загрузка…';try{const entities=['academic_performance','academic_periods','predictions'];const [r,p,pr]=await Promise.all(entities.map(x=>api(`/admin/tables/${x}?student_id=${id}&limit=100`)));const student=(window.adminStudents||[]).find(x=>x.student_id===id),records=r.items||[];box.className='';box.innerHTML=`<div class="details-row"><h3>${esc(student?.full_name||'Студент')}</h3><p class="sub">${esc(student?.email||'—')} · ${esc(student?.group_name||'без группы')}</p><p><b>GPA:</b> ${esc(student?.gpa??'—')} · <b>оценок:</b> ${records.length} · <b>периодов:</b> ${(p.items||[]).length} · <b>прогнозов:</b> ${(pr.items||[]).length}</p></div>${records.length?jsonTable(records.map(x=>({Предмет:x.course_id,Оценка:x.current_grade,Кредиты:x.credits,Посещаемость:x.attendance??'—'}))):'<div class="empty">Академических результатов пока нет.</div>'}`}catch(e){box.className='danger-text';box.textContent=e.message}}
async function adminGpa(){const box=$('#adminGpaResult');box.textContent='Считаю…';try{const d=await api('/admin/analytics/comparable-gpa');box.className='';box.innerHTML=(d.groups||[]).map(g=>`<div class="details-row"><b>${esc(g.calendar)} · ${esc(g.scale_name||'единая шкала')}</b><div class="metric">${esc(g.average_gpa??'—')}</div><p class="sub">${g.student_count} студентов</p>${(g.students||[]).map(x=>`<p>${esc(x.student)} <span class="pill" style="float:right">${esc(x.gpa??'—')}</span></p>`).join('')}</div>`).join('')||`<p>${esc(d.reason||'Нет сопоставимых данных')}</p>`}catch(e){box.textContent=e.message}}
async function adminAsk(){const box=$('#adminAnswer');box.textContent='Выполняю…';try{const d=await api('/admin/assistant','POST',{message:$('#adminPrompt').value});box.className='';box.innerHTML=d.kind==='table'?jsonTable(d.result.items||[]):d.kind==='comparable_gpa'?(d.result.groups||[]).map(g=>`<p><b>${esc(g.calendar)}:</b> ${esc(g.average_gpa??'GPA не вычисляется без шкалы')}</p>`).join(''):`<p>${esc(d.text)}</p><p class="sub">${esc((d.tables||[]).join(', '))}</p>`}catch(e){box.textContent=e.message}}
async function adminSearch(){const box=$('#adminResults');box.textContent='Загрузка…';try{const d=await api(`/admin/tables/${encodeURIComponent($('#adminEntity').value)}?q=${encodeURIComponent($('#adminQuery').value)}&limit=100`);const items=d.items||d||[];box.className='table-wrap';box.innerHTML=items.length?jsonTable(items):'<div class="empty">Ничего не найдено.</div>'}catch(e){box.className='empty danger-text';box.textContent=e.message}}function jsonTable(items){const keys=[...new Set(items.flatMap(Object.keys))].slice(0,9);return `<table class="table"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${keys.map(k=>`<td>${esc(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const accentPresets=[['Blue','#2563EB'],['Purple','#7C3AED'],['Violet','#8B5CF6'],['Pink','#DB2777'],['Red','#DC2626'],['Orange','#EA580C'],['Yellow','#CA8A04'],['Green','#16A34A'],['Teal','#0D9488'],['Cyan','#0891B2']];
function settings(){const hue=hexHue(state.prefs.accent_color);setPage('Настройки','Профиль, оформление и сеанс приложения.',state.me?.role==='admin'?'<a class="btn ghost" href="/admin">Настройка ИИ-ключа</a>':'',`<div class="grid"><div class="card span8"><section class="settings-section"><h2>Язык</h2><p class="sub">Выбор сохраняется в вашем профиле.</p><div class="field"><label>Язык интерфейса</label><select class="input" onchange="setLanguage(this.value)"><option value="en" ${state.prefs.language==='en'?'selected':''}>English</option><option value="kk" ${state.prefs.language==='kk'?'selected':''}>Қазақша</option><option value="ru" ${state.prefs.language==='ru'?'selected':''}>Русский</option><option value="zh" ${state.prefs.language==='zh'?'selected':''}>中文</option><option value="es" ${state.prefs.language==='es'?'selected':''}>Español</option></select></div></section><section class="settings-section"><h2>Внешний вид</h2><p class="sub">Настройте тему и основной акцентный цвет интерфейса.</p><h3>Режим отображения</h3><div class="appearance-grid">${[['light','Светлый'],['dark','Тёмный'],['reading','Режим чтения']].map(([v,n])=>`<button class="mode-card ${state.prefs.display_mode===v?'active':''}" onclick="chooseTheme('${v}')"><div class="mode-preview ${v}"></div><b>${n}</b></button>`).join('')}</div><p class="sub" style="margin-top:10px">Режим чтения использует тёплые поверхности с низким контрастом.</p></section><section class="settings-section"><h2>Акцентный цвет</h2><p class="sub">Выберите готовый цвет или создайте собственный.</p><div class="settings-tabs"><button class="${state.accentTab==='preset'?'active':''}" onclick="accentTab('preset')">Готовые цвета</button><button class="${state.accentTab==='custom'?'active':''}" onclick="accentTab('custom')">Свой цвет</button></div>${state.accentTab==='preset'?`<div class="accent-grid">${accentPresets.map(([n,c])=>`<button class="accent-card ${state.accentSource==='preset'&&state.prefs.accent_color===c?'active':''}" onclick="setAccent('${c}')"><span class="swatch" style="background:${presetAccent(c,state.prefs.display_mode)}">${state.accentSource==='preset'&&state.prefs.accent_color===c?'✓':''}</span><span>${n}</span></button>`).join('')}</div>`:`<div><h3>Пользовательский оттенок</h3><p class="sub">Изменяйте оттенок — интерфейс обновляется сразу.</p><div class="hue-preview" id="huePreview">${esc(state.prefs.accent_color)}</div><div class="field"><label>Custom hue</label><input class="range" type="range" min="0" max="359" value="${hue}" oninput="customHue(this.value)"></div><div style="display:flex;justify-content:space-between" class="sub"><span>0°</span><span>120°</span><span>240°</span><span>359°</span></div><button class="btn secondary" style="margin-top:14px" onclick="resetPrefs()">Сбросить к стандартному</button></div>`}</section><button class="btn wide" onclick="savePreferences()">Сохранить настройки</button><div id="appearanceMsg" class="message"></div></div><div class="span4"><div class="card" style="margin-bottom:18px"><h2>Профиль</h2><div class="field"><label>Имя</label><input id="setName" class="input" value="${esc(nameOf())}"></div><div class="field"><label>Группа</label><input id="setGroup" class="input" value="${esc(rows('students')[0]?.group_name||'')}"></div><button class="btn wide" onclick="saveProfile()">Сохранить профиль</button><div id="profileMsg" class="message"></div></div><div class="card"><h2>Сеанс</h2><p class="sub">Токен хранится только в пределах этой вкладки браузера и удаляется при выходе.</p><button class="btn danger wide" onclick="logout()">Выйти</button><p style="margin-top:18px"><a href="/docs">Документация API</a></p></div></div></div>`)}
function chooseTheme(v){state.prefs.display_mode=v;applyAppearance();render()}function setAccent(v){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs.accent_color=validAccent(v);applyAppearance();render()}function accentTab(v){state.accentTab=v;render()}function setLanguage(v){state.prefs.language=v;applyAppearance();render()}function customHue(v){state.accentSource='custom';localStorage.setItem('sp_accent_source','custom');state.prefs.accent_color=hueToHex(+v);applyAppearance();const p=$('#huePreview');if(p)p.textContent=state.prefs.accent_color}function resetPrefs(){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs={...DEFAULT_PREFS};applyAppearance();render()}
async function savePreferences(){try{await api('/tables/user_preferences','POST',{data:{language:state.prefs.language,display_mode:state.prefs.display_mode,accent_color:state.prefs.accent_color}});const m=$('#appearanceMsg');m.style.color='var(--accent)';m.textContent='Настройки сохранены'}catch(e){$('#appearanceMsg').textContent=e.message}}
async function saveProfile(){try{await api(`/tables/students/${state.me.student_id}`,'PATCH',{data:{full_name:$('#setName').value.trim(),group_name:$('#setGroup').value.trim()||null}});$('#profileMsg').style.color='var(--accent)';$('#profileMsg').textContent='Сохранено';await refresh()}catch(e){$('#profileMsg').textContent=e.message}}
async function logout(){try{await api('/auth/logout','POST')}catch{}sessionStorage.removeItem('sp_token');state.token='';location.reload()}
bootstrap();
</script></body></html>
