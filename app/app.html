<title>Perfecta — Student Performance</title>
<style>
:root{color-scheme:light;--accent:#4f6f8f;--accent2:#e8eef4;--accent-contrast:#fff;--accent-text:#315779;--ink:#0f172a;--muted:#64748b;--bg:#f1f5f9;--card:#fff;--line:#dfe6ed;--side:#fff;--side-ink:#1e293b;--danger:#c94343;--shadow:0 16px 38px rgba(22,35,57,.08)}
*{box-sizing:border-box}body{margin:0;zoom:var(--ui-zoom,1);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f1f5f9,#e8eef4)}
.auth-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 70px #0007}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-contrast);font-weight:800}.brand-logo{width:46px;height:46px;border-radius:12px;object-fit:cover;display:block}.brand b{display:block;font-size:16px}.brand small{color:var(--muted)}h1{font-size:28px;margin:28px 0 8px}h2{font-size:20px;margin:0}h3{margin:0 0 10px}.sub{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:650}.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;color:var(--ink);outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #0f8f8520}textarea.input{min-height:92px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-contrast);font-weight:700}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#edf2f5;color:var(--ink)}.btn.ghost{background:transparent;color:var(--accent-text);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--danger)}.wide{width:100%}.switch-auth{text-align:center;margin-top:16px}.link,a{border:0;background:none;color:var(--accent-text);font-weight:700}.message{min-height:20px;margin-top:12px;color:var(--danger)}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--side);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.sidebar .brand{padding:0 7px 25px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8c3d2;text-align:left;padding:12px 14px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.nav .admin-only{color:#92e4da}.profile{margin-top:auto;border-top:1px solid #ffffff18;padding:18px 7px 0;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d7f2ee;color:#08756d;font-weight:800}.profile b,.profile small{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile small{color:#91a0b6;margin-top:2px}.main{min-width:0;padding:34px clamp(20px,4vw,56px) 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.top h1{margin:0 0 8px}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:30px;font-weight:800;margin:12px 0 4px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800;color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--accent2);color:#08756d;font-weight:750;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;color:var(--muted);font-size:12px;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:14px 12px;border-bottom:1px solid var(--line)}.table tr:last-child td{border:0}.table .btn{padding:7px 10px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:18px 0}.toolbar .field{margin:0;min-width:190px}.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.chat-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.chat-side .choice{width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:9px}.chat-side .choice.active{border-color:var(--accent);background:var(--accent2)}.messages{height:430px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}.bubble{max-width:82%;padding:12px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:var(--accent);color:var(--accent-contrast);border-bottom-right-radius:4px}.bubble.bot{align-self:flex-start;background:#edf2f5;border-bottom-left-radius:4px}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.composer textarea{min-height:52px;max-height:140px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;color:var(--muted)}
.calc-rows{display:grid;gap:8px}.calc-row{display:grid;grid-template-columns:1fr 130px 120px 40px;gap:8px}.result{background:linear-gradient(135deg,#0c8178,#135f72);color:#fff}.result .metric{font-size:42px}.modal{position:fixed;inset:0;background:#06101dbb;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;width:35px;height:35px}.notice{border-left:4px solid var(--accent);background:var(--accent2);color:var(--ink);padding:12px 14px;border-radius:8px;line-height:1.5}.danger-text{color:var(--danger)}
.sidebar{background:var(--side);color:var(--side-ink);border-right:1px solid var(--line)}.nav button{color:var(--muted)}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}.nav .admin-only{color:var(--accent)}.profile{border-color:var(--line)}.profile small{color:var(--muted)}.avatar{background:var(--accent2);color:var(--accent)}.pill{color:var(--accent)}
body[data-theme="light"]{--ink:#1f2937;--muted:#596579;--bg:#f0f1f1;--card:#fff;--line:#dce2e8;--side:#fff;--side-ink:#1f2937;--shadow:0 14px 34px rgba(22,35,57,.09)}body[data-theme="dark"]{--ink:#f7f9fc;--muted:#b9c4d4;--bg:#121926;--card:#111a2a;--line:#52637c;--side:#111a2a;--side-ink:#fff;--danger:#ff8b8b;--shadow:0 16px 38px rgba(0,0,0,.24)}body[data-theme="reading"]{--ink:#2f352f;--muted:#625e55;--bg:#cac6bc;--card:#fffaf0;--line:#c9bfaa;--side:#fffaf0;--side-ink:#2f352f;--shadow:0 14px 34px rgba(84,69,43,.12)}body{transition:background-color .2s,color .2s}body[data-theme="dark"] .input,body[data-theme="dark"] .choice,body[data-theme="dark"] .quick button,body[data-theme="dark"] .accent-card,body[data-theme="dark"] .mode-card{background:#101b2d;color:var(--ink);border-color:var(--line)}body[data-theme="dark"] .btn.secondary{background:#2b3b55;color:#f7f9fc}body[data-theme="dark"] .btn.danger{background:#3a2028;color:#ffb4b4}body[data-theme="dark"] .bubble.bot{background:#243249;color:#f7f9fc}body[data-theme="dark"] .pill{color:#f7f9fc}body[data-theme="dark"] .table th,body[data-theme="dark"] .table td{color:var(--ink)}body[data-theme="reading"] .btn.secondary{background:#e7ddcd;color:var(--ink)}body[data-theme="reading"] .bubble.bot{background:#e7ddcd}.section-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.section-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:9px}.section-tabs button.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}.details-grid{display:grid;gap:10px}.details-row{border:1px solid var(--line);border-radius:10px;padding:12px}.confirm-box{border:1px solid var(--accent);background:var(--accent2);color:var(--ink);border-radius:12px;padding:14px;margin-top:12px}.student-directory{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.student-card{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;text-align:left}.student-card:hover,.student-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.query-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.query-chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px}.query-chips button.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.appearance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode-card,.accent-card{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px;text-align:left}.mode-card.active,.accent-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.mode-preview{height:52px;border-radius:8px;margin-bottom:9px;border:1px solid #0001}.mode-preview.light{background:linear-gradient(90deg,#fff 0 30%,#f1f5f9 30%)}.mode-preview.dark{background:linear-gradient(90deg,#111a2a 0 30%,#0f1725 30%)}.mode-preview.reading{background:linear-gradient(90deg,#fffaf0 0 30%,#f3ede2 30%)}.accent-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.accent-card{text-align:center;padding:10px 4px}.swatch{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin:0 auto 7px;color:#fff;font-weight:800}.settings-section{margin-bottom:18px}.settings-section h2{margin-bottom:7px}.settings-tabs{display:flex;gap:8px;margin:14px 0}.settings-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px}.settings-tabs button.active{background:var(--accent2);color:var(--accent);border-color:var(--accent)}.hue-preview{height:76px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.range{width:100%;accent-color:var(--accent)}
body[data-theme="reading"]{--muted:#4f4b43}.section-tabs button.active,.settings-tabs button.active,.query-chips button.active,.nav button.active,.nav button:hover,.nav .admin-only,.avatar,.pill{color:var(--accent-text)}.hue-preview{color:var(--accent-contrast)}
@media(max-width:1000px){.span3{grid-column:span 6}.span4,.span5,.span7,.span8{grid-column:span 12}.chat-layout{grid-template-columns:1fr}.chat-side{display:flex;gap:8px}.chat-side .choice{margin:0}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:14px}.sidebar .brand{padding-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.profile{display:none}.main{padding:22px 14px 40px}.top{display:block}.top .actions{margin-top:14px}.span3{grid-column:span 12}.calc-row{grid-template-columns:1fr 85px 75px 40px}.composer{grid-template-columns:1fr}.table{min-width:620px}.appearance-grid{grid-template-columns:1fr}.accent-grid{grid-template-columns:repeat(2,1fr)}}

<script>
const DEFAULT_PREFS={language:'ru',display_mode:'light',accent_color:'#2563EB',ui_scale:100,colorblind_mode:false};
const state={token:sessionStorage.getItem('sp_token')||'',me:null,data:null,view:'dashboard',authMode:'login',authChallenge:null,assistantMode:'basic',messages:[],prefs:{...DEFAULT_PREFS},accentTab:'preset',accentSource:localStorage.getItem('sp_accent_source')||'preset'};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{})});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function nameOf(){return state.data?.students?.[0]?.full_name||state.me?.display_name||state.me?.email||'Студент'}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function validAccent(v){return /^#[0-9a-f]{6}$/i.test(v||'')?v.toUpperCase():DEFAULT_PREFS.accent_color}
function hexFade(hex){const h=validAccent(hex);return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},.14)`}
const FIGMA_ACCENTS={light:{'#2563EB':'#2563EB','#7C3AED':'#7C3AED','#8B5CF6':'#8B5CF6','#DB2777':'#DB2777','#DC2626':'#DC2626','#EA580C':'#EA580C','#CA8A04':'#CA8A04','#16A34A':'#16A34A','#0D9488':'#0D9488','#0891B2':'#0891B2'},dark:{'#2563EB':'#60A5FA','#7C3AED':'#A78BFA','#8B5CF6':'#C084FC','#DB2777':'#F472B6','#DC2626':'#F87171','#EA580C':'#FB923C','#CA8A04':'#FACC15','#16A34A':'#4ADE80','#0D9488':'#2DD4BF','#0891B2':'#22D3EE'},reading:{'#2563EB':'#4F6F8F','#7C3AED':'#76658A','#8B5CF6':'#806A91','#DB2777':'#9B6577','#DC2626':'#A65D57','#EA580C':'#A86F45','#CA8A04':'#9A7B32','#16A34A':'#5F7F62','#0D9488':'#4F8078','#0891B2':'#4F7F8A'}};
const LEGACY_ACCENTS={'#4F6F8F':'#2563EB','#76658A':'#7C3AED','#806A91':'#8B5CF6','#9B6577':'#DB2777','#A65D57':'#DC2626','#A86F45':'#EA580C','#9A7B32':'#CA8A04','#5F7F62':'#16A34A','#4F8078':'#0D9488','#4F7F8A':'#0891B2'};
function presetAccent(base,mode){return FIGMA_ACCENTS[mode]?.[base]||base}function appliedAccent(base,mode){return state.accentSource==='custom'?base:presetAccent(base,mode)}
function contrastText(hex){const c=hex.replace('#',''),rgb=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16)/255),linear=rgb.map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4),l=.2126*linear[0]+.7152*linear[1]+.0722*linear[2];return (l+.05)/.05>(1.05)/(l+.05)?'#000000':'#FFFFFF'}
function applyAppearance(){state.prefs={...DEFAULT_PREFS,...state.prefs,accent_color:validAccent(state.prefs.accent_color),ui_scale:Math.min(120,Math.max(85,+state.prefs.ui_scale||100)),colorblind_mode:!!state.prefs.colorblind_mode};if(LEGACY_ACCENTS[state.prefs.accent_color]){state.prefs.accent_color=LEGACY_ACCENTS[state.prefs.accent_color];state.accentSource='preset';localStorage.setItem('sp_accent_source','preset')}const mode=['light','dark','reading'].includes(state.prefs.display_mode)?state.prefs.display_mode:'light',accent=appliedAccent(state.prefs.accent_color,mode),hue=hexHue(state.prefs.accent_color),accentText=mode==='dark'?`hsl(${hue} 82% 76%)`:`hsl(${hue} 68% 28%)`;document.body.dataset.theme=mode;document.documentElement.style.colorScheme=mode==='dark'?'dark':'light';document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent2',hexFade(accent));document.documentElement.style.setProperty('--accent-contrast',contrastText(accent));document.documentElement.style.setProperty('--accent-text',accentText);document.documentElement.lang=state.prefs.language;document.documentElement.style.setProperty('--ui-zoom',state.prefs.ui_scale/100);document.body.dataset.colorblind=state.prefs.colorblind_mode?'true':'false';const cb=state.prefs.colorblind_mode;const safe={light:{accent:'#0072B2',accent2:'#DCEAF3',text:'#003B5C',danger:'#D55E00'},dark:{accent:'#56B4E9',accent2:'#263B4A',text:'#BFE7FA',danger:'#E69F00'},reading:{accent:'#0072B2',accent2:'#E8DDB8',text:'#274C5E',danger:'#D55E00'}}[mode];for(const [k,v] of Object.entries(cb?{'--accent':safe.accent,'--accent2':safe.accent2,'--accent-text':safe.text,'--danger':safe.danger,'--accent-contrast':contrastText(safe.accent)}:{'--accent':accent,'--accent2':hexFade(accent),'--accent-text':accentText,'--danger':'','--accent-contrast':contrastText(accent)}))document.documentElement.style.setProperty(k,v)}
function hueToHex(h){const s=.3,l=.43,a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hexHue(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(!d)return 0;let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}
async function bootstrap(){if(!state.token){applyAppearance();return showAuth()}try{state.me=await api('/me');[state.data,state.prefs]=await Promise.all([api('/data'),api('/preferences')]);state.prefs={...DEFAULT_PREFS,...state.prefs};applyAppearance();$('#profileName').textContent=nameOf();$('#avatar').textContent=initials(nameOf());$('#profileRole').textContent=state.me.role==='admin'?'Администратор':'Личный профиль';$('.admin-only').classList.toggle('hidden',state.me.role!=='admin');document.querySelectorAll('.student-only').forEach(x=>x.classList.toggle('hidden',state.me.role==='admin'));if(state.me.role==='admin'&&!['admin','calculator','settings'].includes(state.view))state.view='admin';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('sp_token');state.token='';showAuth(e.message)}}
function showAuth(message=''){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');$('#authMessage').textContent=message}
function setAuthMode(mode,message=''){state.authMode=mode;state.authChallenge=mode.endsWith('_verify')?state.authChallenge:null;const register=mode==='register',verify=mode==='register_verify'||mode==='reset_verify',forgot=mode==='forgot',resetVerify=mode==='reset_verify';$('#nameField').classList.toggle('hidden',!register);$('#usernameField').classList.toggle('hidden',!register);$('#identifierField').classList.toggle('hidden',verify);$('#codeField').classList.toggle('hidden',!verify);$('#passwordField').classList.toggle('hidden',forgot||mode==='register_verify');$('#passwordHint').classList.toggle('hidden',!(register||resetVerify));$('#password').autocomplete=(register||resetVerify)?'new-password':'current-password';$('#identifierLabel').textContent=forgot?'Email или логин для сброса':register?'Email':'Email или логин';$('#passwordLabel').textContent=resetVerify?'Новый пароль':'Пароль';$('#authTitle').textContent=register?'Регистрация':mode==='register_verify'?'Подтверждение email':forgot?'Сброс пароля':resetVerify?'Новый пароль':'Вход';$('#authSub').textContent=verify?'Введите шестизначный код из письма.':forgot?'Мы отправим код на привязанную почту обычного аккаунта.':'Откройте личные академические данные и инструменты анализа.';$('#authSubmit').textContent=register?'Получить код':mode==='register_verify'?'Подтвердить email':forgot?'Отправить код':resetVerify?'Сохранить новый пароль':'Войти';$('#switchText').textContent=mode==='login'?'Нет аккаунта?':'Вернуться';$('#switchAuth').textContent=mode==='login'?'Зарегистрироваться':'Ко входу';$('#forgotAuth').classList.toggle('hidden',mode!=='login');$('#authMessage').textContent=message}
$('#switchAuth').onclick=()=>setAuthMode(state.authMode==='login'?'register':'login');
$('#forgotAuth').onclick=()=>setAuthMode('forgot');
$('#username').oninput=async()=>{const value=$('#username').value.trim();if(value.length<3){$('#usernameFeedback').textContent='Минимум 3 символа';return}try{const d=await api('/auth/username?username='+encodeURIComponent(value));if(d.available){$('#usernameFeedback').textContent='Логин свободен'}else{const suggestions=d.suggestions||[];$('#usernameFeedback').innerHTML=esc(d.message||'Логин занят')+(suggestions.length?' Варианты: '+suggestions.map(x=>`<button type="button" class="link" onclick="document.querySelector('#username').value='${esc(x)}';document.querySelector('#username').dispatchEvent(new Event('input'))">${esc(x)}</button>`).join(' '):'')}}catch(e){$('#usernameFeedback').textContent=e.message}};
$('#authSubmit').onclick=async()=>{try{$('#authMessage').textContent='';const identifier=$('#email').value.trim(),password=$('#password').value,code=$('#verificationCode').value.trim();if(state.authMode==='login'){if(!identifier)throw Error('Введите email или логин');const d=await api('/auth/login','POST',{identifier,password});state.token=d.session_token;sessionStorage.setItem('sp_token',state.token);$('#password').value='';await bootstrap();return}if(state.authMode==='register'){const email=identifier,username=$('#username').value.trim(),full_name=$('#fullName').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))throw Error('Введите корректный email');if(!/^[A-Za-z][A-Za-z0-9_]{2,29}$/.test(username))throw Error('Логин: 3–30 латинских букв, цифр или _');if(!full_name)throw Error('Укажите имя');if(password.length<8)throw Error('Пароль должен содержать минимум 8 символов');const d=await api('/auth/register/start','POST',{email,username,password,full_name});state.authChallenge=d.challenge_id;$('#verificationCode').value='';setAuthMode('register_verify','Код отправлен на '+email);return}if(state.authMode==='register_verify'){const d=await api('/auth/register/verify','POST',{challenge_id:state.authChallenge,code});state.token=d.session_token;sessionStorage.setItem('sp_token',state.token);await bootstrap();return}if(state.authMode==='forgot'){if(!identifier)throw Error('Введите email или логин');const d=await api('/auth/password-reset/start','POST',{identifier});if(!d.challenge_id){setAuthMode('login','Если аккаунт поддерживает сброс, письмо отправлено на привязанный адрес.');return}state.authChallenge=d.challenge_id;$('#verificationCode').value='';$('#password').value='';setAuthMode('reset_verify','Код отправлен на привязанную почту.');return}if(state.authMode==='reset_verify'){if(password.length<8)throw Error('Новый пароль должен содержать минимум 8 символов');await api('/auth/password-reset/complete','POST',{challenge_id:state.authChallenge,code,new_password:password});$('#password').value='';setAuthMode('login','Пароль изменён. Теперь войдите с новым паролем.')}}catch(e){$('#authMessage').textContent=e.message}};
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function setPage(title,sub,actions='',html=''){$('#content').innerHTML=`<header class="top"><div><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div><div class="actions">${actions}</div></header>${html}`}
function rows(key){return Array.isArray(state.data?.[key])?state.data[key]:[]}function localizedCourseName(name){const map={en:{'Calculus 1':'Calculus 1','Introduction to Programming 1':'Introduction to Programming 1','Information and Communication Technologies':'Information and Communication Technologies','Foreign Language 1':'Foreign Language 1','History of Kazakhstan':'History of Kazakhstan','Physical Education':'Physical Education','Philosophy':'Philosophy','Political Science':'Political Science'},kk:{'Calculus 1':'Calculus 1','Introduction to Programming 1':'Бағдарламалауға кіріспе 1','Information and Communication Technologies':'Ақпараттық-коммуникациялық технологиялар','Foreign Language 1':'Шетел тілі 1','History of Kazakhstan':'Қазақстан тарихы','Physical Education':'Дене шынықтыру','Philosophy':'Философия','Political Science':'Саясаттану'},zh:{'Calculus 1':'微积分 1','Introduction to Programming 1':'程序设计导论 1','Information and Communication Technologies':'信息与通信技术','Foreign Language 1':'外语 1','History of Kazakhstan':'哈萨克斯坦历史','Physical Education':'体育','Philosophy':'哲学','Political Science':'政治学'},es:{'Calculus 1':'Cálculo 1','Introduction to Programming 1':'Introducción a la programación 1','Information and Communication Technologies':'Tecnologías de la información y la comunicación','Foreign Language 1':'Lengua extranjera 1','History of Kazakhstan':'Historia de Kazajistán','Physical Education':'Educación física','Philosophy':'Filosofía','Political Science':'Ciencia política'}};return map[state.prefs.language]?.[name]||name}
function courseLabel(id){const n=courseName(id);return localizedCourseName(n)}
function courseLabel(id){return rows('courses').find(x=>x.course_id==id)?.course_name||rows('courses').find(x=>x.course_id==id)?.name||`Курс #${id}`}function periodName(id){const p=rows('academic_periods').find(x=>x.period_id==id);return p?.period_name||p?.name||`Период ${p?.period_number||id}`}
function activePeriod(){return rows('academic_periods').find(x=>x.status==='active')||rows('academic_periods')[0]}function activeResults(){const p=activePeriod();return rows('academic_performance').filter(x=>!p||x.period_id==p.period_id)}
function weighted(rs){let sum=0,w=0;for(const r of rs){if(r.current_grade!=null&&+r.credits>0){sum+=+r.current_grade*+r.credits;w+=+r.credits}}return w?sum/w:null}

async function saveSubject(id){const val=x=>$(x).value===''?null:+$(x).value,workload=val('#mWorkload'),unit=$('#mWorkloadUnit').value,data={period_id:+$('#mPeriod').value,workload_value:workload,workload_unit:unit,credits:unit==='credits'?workload:null,current_grade:val('#mGrade'),recent_assessment_score:val('#mRecent'),lessons_held:val('#mHeld'),lessons_attended:val('#mAttended'),lessons_excused:val('#mExcused')??0};const newName=$('#mNewCourse')?.value.trim(),courseId=+$('#mCourse').value;if(!data.period_id)return $('#modalMsg').textContent='Выберите учебный период';if(workload==null||workload<=0)return $('#modalMsg').textContent='Укажите положительную учебную нагрузку';if(!id&&!newName&&!courseId)return $('#modalMsg').textContent='Введите новый предмет или выберите существующий';if(data.lessons_held!=null&&((data.lessons_attended||0)+data.lessons_excused>data.lessons_held))return $('#modalMsg').textContent='Посещённые и уважительные занятия не могут превышать проведённые';try{if(id){data.course_id=courseId;await api('/tables/academic_performance/'+id,'PATCH',{data})}else if(newName){await api('/academic/subjects','POST',{data:{...data,course_name:newName,entry_method:'manual'}})}else{data.course_id=courseId;await api('/tables/academic_performance','POST',{data})}closeModal();await refresh()}catch(e){$('#modalMsg').textContent=e.message}}
const entityFields={study_programs:[['institution_name','Учебное заведение','text'],['program_name','Название программы','text'],['education_level','Уровень: school/college/bachelor/master/doctorate/other','text'],['duration_years','Срок обучения, лет','number'],['total_required_credits','Всего кредитов','number'],['calendar_type','Календарь: semester/trimester/quarter/annual/other','text'],['suggested_period_count','Периодов','number']],academic_years:[['program_id','ID программы','number'],['year_number','Номер года','number'],['year_label','Название года','text'],['start_date','Начало','date'],['end_date','Конец','date'],['planned_period_count','Количество периодов','number']],academic_periods:[['settings_id','ID настроек','number'],['year_id','ID учебного года','number'],['academic_year','Учебный год','text'],['period_name','Название периода','text'],['period_number','Номер периода','number'],['start_date','Начало','date'],['end_date','Конец','date'],['planned_lessons','План занятий','number'],['status','Статус: planned/active/completed','text']],academic_settings:[['institution_name','Учебное заведение','text'],['calendar_type','Календарь','text'],['calendar_label','Название календаря','text'],['grading_scale','Шкала: percent_100/gpa_4/letter/other','text'],['grade_min','Минимум','number'],['grade_max','Максимум','number'],['credit_system','Кредиты: ects/local/other/unknown','text'],['scale_id','ID шкалы GPA','number']],grading_scales:[['name','Название','text'],['minimum_score','Минимум','number'],['maximum_score','Максимум','number']],grading_bands:[['scale_id','ID шкалы','number'],['score_range','Диапазон, например [90,101)','text'],['letter_grade','Буквенная оценка','text'],['grade_points','GPA','number']],assessment_components:[['performance_id','ID результата предмета','number'],['name','Название','text'],['component_type','Тип: quiz/assignment/midterm/final/other','text'],['weight_percent','Вес, %','number']],assessments:[['component_id','ID компонента', function assistant(){setPage('Академический помощник','Один интерфейс — два режима: подключаемый ИИ и локальные функции без ИИ.','',`<div class="chat-layout"><div class="card chat-side"><h3>Режим</h3><button class="choice ${state.assistantMode==='basic'?'active':''}" onclick="mode('basic')"><b>Без ИИ</b><div class="sub">Расчёт, поиск и сводки локально</div></button><button class="choice ${state.assistantMode==='ai'?'active':''}" onclick="mode('ai')"><b>ИИ-помощник</b><div class="sub">Последовательные запросы через настроенную модель</div></button><p class="sub" style="margin-top:16px">Помощник видит только данные текущего аккаунта. Запись через ИИ требует подтверждения.</p></div><div class="card"><div id="messages" class="messages">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.who}">${esc(m.text)}</div>`).join(''):`<div class="bubble bot">${state.assistantMode==='basic'?'Я работаю без внешней модели. Могу показать средний балл, посещаемость, предметы, кредиты, выполнить прогноз или открыть калькулятор.':'Опишите задачу обычным языком. Если ИИ предложит изменить данные, я сначала попрошу подтверждение.'}</div>`}</div>${window.pendingConfirmation?`<div class="confirm-box"><b>ИИ предлагает изменения</b><div style="margin:10px 0">${(window.pendingActions||[]).map(describeAction).map(esc).join('<br>')}</div><button class="btn" onclick="confirmAIChanges()">Подтвердить изменения</button> <button class="btn secondary" onclick="cancelAIChanges()">Отменить</button></div>`:''}<div class="quick">${['Покажи средний балл','Какая посещаемость?','Сколько у меня кредитов?','Сделай прогноз'].map(x=>`<button onclick="ask('${x}')">${x}</button>`).join('')}</div><div class="composer"><textarea id="prompt" class="input" placeholder="Например: покажи оценки и затем сделай прогноз"></textarea><button class="btn" onclick="ask()">Отправить</button></div></div></div>`);setTimeout(()=>{const m=$('#messages');if(m)m.scrollTop=m.scrollHeight})}
function mode(m){state.assistantMode=m;state.messages=[];assistant()}
async function ask(q){const input=$('#prompt'),text=q||(input?.value||'').trim();if(!text)return;state.messages.push({who:'user',text});if(input)input.value='';state.messages.push({who:'bot',text:'Выполняю…'});assistant();try{const answer=state.assistantMode==='ai'?await aiAsk(text):await basicAsk(text);state.messages[state.messages.length-1]={who:'bot',text:answer}}catch(e){state.messages[state.messages.length-1]={who:'bot',text:'Не удалось выполнить: '+e.message}}assistant()}
async function basicAsk(text){const t=text.toLowerCase(),rs=activeResults(),avg=weighted(rs);if(/прогноз/.test(t)){const p=activePeriod();if(!p)return 'Сначала добавьте активный учебный период.';const r=await api('/predict','POST',{period_id:p.period_id,level:'period',save:false});return `Иллюстративный прогноз на текущий период: ${r.average??'нет данных'}. Метод: ${r.method_version||r.method||'консервативная базовая модель'}.`}if(/посещ/.test(t)){let held=0,att=0,exc=0;rs.forEach(x=>{held+=+x.lessons_held||0;att+=+x.lessons_attended||0;exc+=+x.lessons_excused||0});return held?`Зачтено ${att+exc} из ${held} занятий — ${((att+exc)/held*100).toFixed(1)}%. Фактически посещено: ${att}, уважительно пропущено: ${exc}.`:'Для расчёта посещаемости пока недостаточно данных.'}if(/кредит|нагруз|час|урок/.test(t)){const totals={};rs.forEach(x=>{const u=x.workload_unit||'credits',v=x.workload_value??x.credits;if(v!=null)totals[u]=(totals[u]||0)+Number(v)});return 'Учебная нагрузка: '+(Object.entries(totals).map(([u,v])=>`${v} ${{credits:'кредитов',academic_hours:'академических часов',lessons:'уроков'}[u]||u}`).join(', ')||'не указана')+'.'}if(/средн|оцен|балл/.test(t))return avg==null?'Нет оценок для расчёта.':`Средний балл за текущий период: ${avg.toFixed(1)}. Предметов: ${rs.length}.`;if(/предмет|курс/.test(t))return rs.length?rs.map(x=>`${courseLabel(x.course_id)} — ${x.current_grade??'без оценки'}`).join('\n'):'Предметов пока нет.';if(/кальк/.test(t)){go('calculator');return 'Открыл академический калькулятор.'}return 'Без ИИ я понимаю команды о среднем балле, оценках, предметах, учебной нагрузке, посещаемости, прогнозе и калькуляторе.'}
function describeAction(a){const d=a?.data||a?.draft||{};if(a?.operation==='clarify')return 'Нужно уточнить: '+(a.questions||[]).join(' ');if(a?.operation==='import_profile'){const subjects=d.subjects||[];return `Импорт профиля: ${d.setup?.institution_name||'школа'}, ${d.setup?.program_name||'класс'}, ${d.setup?.start_year||'год'}, 4 периода; предметов: ${subjects.length}.\\n`+subjects.map(x=>`• ${x.course_name}: итоговая ${x.grade_text||x.current_grade||'—'}`).join('\\n')};if(a?.operation==='create_subject')return `Добавить предмет «${d.course_name||'без названия'}»: нагрузка ${d.workload_value??d.credits??'не указана'} ${d.workload_unit||'не указана'}, оценка ${d.current_grade??'не указана'}, посещаемость ${d.attendance??'не указана'}%`;if(a?.operation==='write')return `Изменить ${a.entity}: ${Object.entries(d).map(([k,v])=>`${k}=${v}`).join(', ')}`;return `Выполнить ${a?.operation||'действие'}`}
function formatAIResult(x){if(x.status==='clarification_required')return 'Нужно уточнить перед сохранением:\n'+(x.questions||[]).map((q,i)=>`${i+1}. ${q}`).join('\n')+'\n\nЧерновик: '+describeAction(x.draft?.operation?x.draft:{operation:'create_subject',draft:x.draft||{}});if(x.status!=='ok')return x.status==='skipped_after_failure'?'Следующий шаг пропущен из-за предыдущей ошибки.':`Не удалось выполнить шаг ${(x.index??0)+1}: ${x.detail||x.status}`;const r=x.result||{};if(r.text)return r.text;if(x.operation==='predict')return `Прогноз (${r.level||'period'}): средний балл ${r.average??'—'}, GPA ${r.gpa??'—'}. Метод: ${r.method_version||r.method||'базовая модель'}. Предметов: ${(r.subjects||[]).length}.`;if(x.operation==='calculate')return `Расчёт ${r.mode||''}: ${r.gpa!=null?'GPA '+r.gpa:r.average!=null?'средний балл '+r.average:r.attendance!=null?'посещаемость '+r.attendance+'%':'готово'}.`;if(x.operation==='read'){const items=r.items||[];return items.length?`Найдено записей: ${r.total??items.length}.\n`+items.slice(0,20).map(v=>v.course_id?`${courseLabel(v.course_id)} — оценка ${v.current_grade??'—'}, ${v.credits??'—'} кр.`:JSON.stringify(v)).join('\n'):'Записей не найдено.'}if(x.operation==='create_subject')return 'Предмет и его академические данные сохранены.';if(x.operation==='import_profile')return `Профиль сохранён: создано ${r.created??0} предметов и учебный период. Теперь данные доступны в разделе «Академические данные».`;if(x.operation==='write')return 'Изменения сохранены.';return JSON.stringify(r,null,2)}
async function aiAsk(text){const message=window.aiDraftContext?('Предыдущий черновик данных: '+JSON.stringify(window.aiDraftContext)+'\nОтвет пользователя на уточнение: '+text):text;const d=await api('/ai/chat','POST',{message});const completed=formatAI(d);if(d.status==='clarification_required'){window.aiDraftContext=d.draft_context||null;return completed+'\n\nОтветьте на вопросы выше одним сообщением.'}if(d.status==='confirmation_required'){window.aiDraftContext=null;window.pendingConfirmation=d.confirmation_token;window.pendingActions=d.proposed_actions;const note=`Проверьте каждое поле. Ожидает подтверждения: ${d.proposed_actions.length} изменение(я).`;return completed&&completed!=='Запрос выполнен.'?completed+'\\n\\n'+note:note}window.aiDraftContext=null;return completed}function formatAI(d){return (d.results||[]).map(formatAIResult).join('\n\n')||'Запрос выполнен.'}
async function confirmAIChanges(){try{const d=await api('/ai/execute','POST',{confirmation_token:window.pendingConfirmation});window.pendingConfirmation=null;window.pendingActions=null;state.messages.push({who:'bot',text:formatAI(d)});state.data=await api('/data');assistant()}catch(e){state.messages.push({who:'bot',text:'Изменения не выполнены: '+e.message});assistant()}}
function cancelAIChanges(){window.pendingConfirmation=null;window.pendingActions=null;window.aiDraftContext=null;state.messages.push({who:'bot',text:'Предложенные изменения отменены.'});assistant()}
function calculator(){if(!['gpa','course','attendance'].includes(window.calcMode))window.calcMode='gpa';const modes=[['gpa','Средний GPA'],['course','GPA дисциплины'],['attendance','Посещаемость']];setPage('Академический калькулятор','Каждый расчёт выполняется отдельно и не смешивает пустые поля с нулями.',state.me?.role==='admin'?'':`<button class="btn secondary" onclick="loadSavedCalc()">Взять текущие данные</button>`,`<div class="section-tabs">${modes.map(([v,n])=>`<button class="${window.calcMode===v?'active':''}" onclick="window.calcMode='${v}';calculator()">${n}</button>`).join('')}</div><div class="grid"><div class="card span8"><div class="field"><label>Учебный календарь</label><select id="calcCalendar" class="input"><option value="trimester">Триместр</option><option value="semester">Семестр</option><option value="quarter">Четверть</option><option value="annual">Год</option><option value="other">Другой</option></select></div>${window.calcMode==='attendance'?`<div class="grid"><div class="field span4"><label>Всего проведено</label><input id="lessonsTotal" class="input" type="number" min="1"></div><div class="field span4"><label>Посещено</label><input id="lessonsAttended" class="input" type="number" min="0"></div><div class="field span4"><label>Уважительные пропуски</label><input id="lessonsExcused" class="input" type="number" min="0"></div></div>`:`<div class="field"><label>Единица учебной нагрузки</label><select id="calcWorkloadUnit" class="input"><option value="credits">Кредиты</option><option value="academic_hours">Академические часы</option><option value="lessons">Уроки / занятия</option></select></div><h3>${window.calcMode==='course'?'Одна дисциплина':'Оценки и нагрузка'}</h3><div id="calcRows" class="calc-rows"></div>${window.calcMode==='course'?'':`<button class="btn secondary" style="margin-top:10px" onclick="addCalcRow()">+ Добавить строку</button>`}<p class="sub">Пустая оценка или нагрузка считаются ошибкой. Разные единицы нельзя смешивать без преобразования.</p>`}<button class="btn wide" onclick="runCalc()">Рассчитать</button></div><div id="calcResult" class="card span4 result"><div class="eyebrow" style="color:#dcecff">Результат</div><div class="metric">—</div><p>Заполните данные для выбранного режима.</p></div></div>`);if(window.calcMode!=='attendance'){addCalcRow();if(window.calcMode!=='course')addCalcRow();$('#calcWorkloadUnit').value=academicTemplates[selectedTemplate()].unit}const cal=rows('academic_settings').find(x=>x.settings_id==activePeriod()?.settings_id)?.calendar_type;if(cal&&$('#calcCalendar'))$('#calcCalendar').value=cal}
function addCalcRow(v={}){const d=document.createElement('div');d.className='calc-row';d.innerHTML=`<input class="input cName" placeholder="Предмет" value="${esc(v.name||'')}"><input class="input cGrade" type="number" placeholder="Оценка" value="${esc(v.grade??'')}"><input class="input cCredits" type="number" placeholder="Нагрузка" value="${esc(v.workload??v.credits??'')}"><button class="icon-btn" onclick="this.parentElement.remove()">×</button>`;$('#calcRows').appendChild(d)}
function loadSavedCalc(){const rs=activeResults();if(window.calcMode==='attendance'){const held=rs.reduce((s,x)=>s+(Number(x.lessons_held)||0),0),att=rs.reduce((s,x)=>s+(Number(x.lessons_attended)||0),0),exc=rs.reduce((s,x)=>s+(Number(x.lessons_excused)||0),0);$('#lessonsTotal').value=held||'';$('#lessonsAttended').value=att||'';$('#lessonsExcused').value=exc||''}else{const unit=rs.find(x=>x.workload_unit)?.workload_unit||'credits';$('#calcWorkloadUnit').value=unit;$('#calcRows').innerHTML='';(window.calcMode==='course'?rs.slice(0,1):rs).filter(x=>(x.workload_unit||'credits')===unit).forEach(x=>addCalcRow({name:courseLabel(x.course_id),grade:x.current_grade,workload:x.workload_value??x.credits}));if(!$('#calcRows').children.length)addCalcRow()}}
async function runCalc(){try{let payload={calendar:$('#calcCalendar').value,mode:window.calcMode};if(window.calcMode==='attendance'){const raw=[$('#lessonsTotal').value,$('#lessonsAttended').value,$('#lessonsExcused').value];if(raw.slice(0,2).some(v=>v===''))throw Error('Заполните общее количество и посещённые занятия');const total=Number(raw[0]),att=Number(raw[1]),exc=raw[2]===''?0:Number(raw[2]);if(!Number.isFinite(total)||!Number.isFinite(att)||!Number.isFinite(exc)||total<=0||att<0||exc<0||att+exc>total)throw Error('Проверьте количество занятий и пропусков');payload.items=[{lessons_held:total,lessons_attended:att,lessons_excused:exc}];const d=await api('/calculate','POST',payload);$('#calcResult').innerHTML=`<div class="eyebrow" style="color:#dcecff">Зачтённая посещаемость</div><div class="metric">${d.attendance.toFixed(1)}%</div><p>Фактически ${d.physical_attendance.toFixed(1)}% · посещено ${att} · уважительно ${exc} · всего ${total}</p>`;return}const itemNodes=[...document.querySelectorAll('.calc-row')];if(!itemNodes.length)throw Error('Добавьте хотя бы одну строку');const unit=$('#calcWorkloadUnit').value,items=itemNodes.map((r,i)=>{const grade=r.querySelector('.cGrade').value,workload=r.querySelector('.cCredits').value;if(grade===''||workload==='')throw Error(`Строка ${i+1}: заполните оценку и нагрузку`);const item={grade:Number(grade),workload_value:Number(workload),workload_unit:unit};if(!Number.isFinite(item.grade)||!Number.isFinite(item.workload_value)||item.workload_value<=0)throw Error(`Строка ${i+1}: неверные числа`);return item});payload.items=items;payload.bands=rows('grading_bands');const d=await api('/calculate','POST',payload),unitName={credits:'кредитов',academic_hours:'академических часов',lessons:'занятий'}[d.workload_unit]||d.workload_unit;$('#calcResult').innerHTML=`<div class="eyebrow" style="color:#dcecff">GPA</div><div class="metric">${d.gpa??'—'}</div><p>Учтено дисциплин: ${d.included_items} · нагрузка: ${d.workload_total} ${unitName}</p>`}catch(e){$('#calcResult').innerHTML=`<div class="eyebrow" style="color:#ffd2d2">Ошибка</div><p>${esc(e.message)}</p>`}}

function renderAdminStudents(){const q=($('#studentSearch')?.value||'').trim().toLowerCase(),filter=window.adminStudentFilter||'all';let list=(window.adminStudents||[]).filter(x=>!q||`${x.full_name} ${x.email} ${x.group_name}`.toLowerCase().includes(q));if(filter==='graded')list=list.filter(x=>x.records);if(filter==='missing')list=list.filter(x=>!x.records);if(filter==='predictions')list=list.filter(x=>x.predictions);$('#studentDirectory').innerHTML=list.map(x=>`<button class="student-card ${window.adminSelectedStudent===x.student_id?'active':''}" onclick="adminStudent(${x.student_id})"><b>${esc(x.full_name||'Без имени')}</b><div class="sub">${esc(x.email||'—')} · ${esc(x.group_name||'без группы')}</div><div style="margin-top:8px"><span class="pill">${x.records} оценок</span> <span class="pill">GPA ${esc(x.gpa??'—')}</span></div></button>`).join('')||'<div class="empty">По этому запросу студентов нет.</div>';if(state.prefs.language!=='ru')applyLanguage()}
async function adminStudent(id){window.adminSelectedStudent=id;renderAdminStudents();const box=$('#studentDetails');box.textContent='Загрузка…';try{const entities=['academic_performance','academic_periods','predictions'];const [r,p,pr]=await Promise.all(entities.map(x=>api(`/admin/tables/${x}?student_id=${id}&limit=100`)));const student=(window.adminStudents||[]).find(x=>x.student_id===id),records=r.items||[];box.className='';box.innerHTML=`<div class="details-row"><h3>${esc(student?.full_name||'Студент')}</h3><p class="sub">${esc(student?.email||'—')} · ${esc(student?.group_name||'без группы')}</p><p><b>GPA:</b> ${esc(student?.gpa??'—')} · <b>оценок:</b> ${records.length} · <b>периодов:</b> ${(p.items||[]).length} · <b>прогнозов:</b> ${(pr.items||[]).length}</p></div>${records.length?jsonTable(records.map(x=>({Предмет:x.course_id,Оценка:x.current_grade,Кредиты:x.credits,Посещаемость:x.attendance??'—'}))):'<div class="empty">Академических результатов пока нет.</div>'}`}catch(e){box.className='danger-text';box.textContent=e.message}}
async function adminGpa(){const box=$('#adminGpaResult');box.textContent='Считаю…';try{const d=await api('/admin/analytics/comparable-gpa');box.className='';box.innerHTML=(d.groups||[]).map(g=>`<div class="details-row"><b>${esc(g.calendar)} · ${esc(g.scale_name||'единая шкала')}</b><div class="metric">${esc(g.average_gpa??'—')}</div><p class="sub">${g.student_count} студентов</p>${(g.students||[]).map(x=>`<p>${esc(x.student)} <span class="pill" style="float:right">${esc(x.gpa??'—')}</span></p>`).join('')}</div>`).join('')||`<p>${esc(d.reason||'Нет сопоставимых данных')}</p>`}catch(e){box.textContent=e.message}}
async function adminAsk(){const box=$('#adminAnswer');box.textContent='Выполняю…';try{const d=await api('/admin/assistant','POST',{message:$('#adminPrompt').value});box.className='';box.innerHTML=d.kind==='table'?jsonTable(d.result.items||[]):d.kind==='comparable_gpa'?(d.result.groups||[]).map(g=>`<p><b>${esc(g.calendar)}:</b> ${esc(g.average_gpa??'GPA не вычисляется без шкалы')}</p>`).join(''):`<p>${esc(d.text)}</p><p class="sub">${esc((d.tables||[]).join(', '))}</p>`}catch(e){box.textContent=e.message}}
async function adminSearch(){const box=$('#adminResults');box.textContent='Загрузка…';try{const d=await api(`/admin/tables/${encodeURIComponent($('#adminEntity').value)}?q=${encodeURIComponent($('#adminQuery').value)}&limit=100`);const items=d.items||d||[];box.className='table-wrap';box.innerHTML=items.length?jsonTable(items):'<div class="empty">Ничего не найдено.</div>'}catch(e){box.className='empty danger-text';box.textContent=e.message}}function jsonTable(items){const keys=[...new Set(items.flatMap(Object.keys))].slice(0,9);return `<table class="table"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${keys.map(k=>`<td>${esc(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const accentPresets=[['Blue','#2563EB'],['Purple','#7C3AED'],['Violet','#8B5CF6'],['Pink','#DB2777'],['Red','#DC2626'],['Orange','#EA580C'],['Yellow','#CA8A04'],['Green','#16A34A'],['Teal','#0D9488'],['Cyan','#0891B2']];
function settings(){const hue=hexHue(state.prefs.accent_color);setPage('Настройки','Профиль, оформление и сеанс приложения.',state.me?.role==='admin'?'<a class="btn ghost" href="/admin">Настройка ИИ-ключа</a>':'',`<div class="grid"><div class="card span8"><section class="settings-section"><h2>Язык</h2><p class="sub">Выбор сохраняется в вашем профиле.</p><div class="field"><label>Язык интерфейса</label><select class="input" onchange="setLanguage(this.value)"><option value="en" ${state.prefs.language==='en'?'selected':''}>English</option><option value="kk" ${state.prefs.language==='kk'?'selected':''}>Қазақша</option><option value="ru" ${state.prefs.language==='ru'?'selected':''}>Русский</option><option value="zh" ${state.prefs.language==='zh'?'selected':''}>中文</option><option value="es" ${state.prefs.language==='es'?'selected':''}>Español</option></select></div></section><section class="settings-section"><h2>Внешний вид</h2><p class="sub">Настройте тему и основной акцентный цвет интерфейса.</p><h3>Режим отображения</h3><div class="appearance-grid">${[['light','Светлый'],['dark','Тёмный'],['reading','Режим чтения']].map(([v,n])=>`<button class="mode-card ${state.prefs.display_mode===v?'active':''}" onclick="chooseTheme('${v}')"><div class="mode-preview ${v}"></div><b>${n}</b></button>`).join('')}</div><p class="sub" style="margin-top:10px">Режим чтения использует тёплые поверхности с низким контрастом.</p></section><section class="settings-section"><h2>Доступность</h2><p class="sub">Настройте размер текста и масштаб интерфейса под свой экран.</p><div class="field"><label>Масштаб интерфейса: <b id="uiScaleValue">${state.prefs.ui_scale}%</b></label><input class="range" type="range" min="85" max="120" step="5" value="${state.prefs.ui_scale}" oninput="setAccessibility('ui_scale',this.value)"></div><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" ${state.prefs.colorblind_mode?'checked':''} onchange="setAccessibility('colorblind_mode',this.checked)"> Режим для дальтоников</label></section><section class="settings-section"><h2>Акцентный цвет</h2><p class="sub">Выберите готовый цвет или создайте собственный.</p><div class="settings-tabs"><button class="${state.accentTab==='preset'?'active':''}" onclick="accentTab('preset')">Готовые цвета</button><button class="${state.accentTab==='custom'?'active':''}" onclick="accentTab('custom')">Свой цвет</button></div>${state.accentTab==='preset'?`<div class="accent-grid">${accentPresets.map(([n,c])=>`<button class="accent-card ${state.accentSource==='preset'&&state.prefs.accent_color===c?'active':''}" onclick="setAccent('${c}')"><span class="swatch" style="background:${presetAccent(c,state.prefs.display_mode)}">${state.accentSource==='preset'&&state.prefs.accent_color===c?'✓':''}</span><span>${n}</span></button>`).join('')}</div>`:`<div><h3>Пользовательский оттенок</h3><p class="sub">Изменяйте оттенок — интерфейс обновляется сразу.</p><div class="hue-preview" id="huePreview">${esc(state.prefs.accent_color)}</div><div class="field"><label>Цвет RGB</label><input id="rgbColor" class="input" type="color" value="${state.prefs.accent_color}" oninput="setCustomColor(this.value)" style="height:48px;padding:4px;cursor:pointer"></div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px"><div class="field"><label>R</label><input id="rgbR" class="input" type="number" min="0" max="255" value="${parseInt(state.prefs.accent_color.slice(1,3),16)}" oninput="setRgbColor()"></div><div class="field"><label>G</label><input id="rgbG" class="input" type="number" min="0" max="255" value="${parseInt(state.prefs.accent_color.slice(3,5),16)}" oninput="setRgbColor()"></div><div class="field"><label>B</label><input id="rgbB" class="input" type="number" min="0" max="255" value="${parseInt(state.prefs.accent_color.slice(5,7),16)}" oninput="setRgbColor()"></div></div><div class="field"><label>Оттенок интерфейса</label><input class="range" type="range" min="0" max="359" value="${hue}" oninput="customHue(this.value)"></div><button class="btn secondary" style="margin-top:14px" onclick="resetPrefs()">Сбросить к стандартному</button></div>`}</section><button class="btn wide" onclick="savePreferences()">Сохранить настройки</button><div id="appearanceMsg" class="message"></div></div><div class="span4"><div class="card" style="margin-bottom:18px"><h2>Профиль</h2><div class="field"><label>Имя</label><input id="setName" class="input" value="${esc(nameOf())}"></div><div class="field"><label>Группа</label><input id="setGroup" class="input" value="${esc(rows('students')[0]?.group_name||'')}"></div><button class="btn wide" onclick="saveProfile()">Сохранить профиль</button><div id="profileMsg" class="message"></div></div><div class="card"><h2>Сеанс</h2><p class="sub">Токен хранится только в пределах этой вкладки браузера и удаляется при выходе.</p><button class="btn danger wide" onclick="logout()">Выйти</button><button class="btn danger wide" style="margin-top:10px" onclick="deleteAccount()">Удалить мой аккаунт</button><p style="margin-top:18px"><a href="/docs">Документация API</a></p></div></div></div>`)}
function chooseTheme(v){state.prefs.display_mode=v;applyAppearance();render()}function setAccent(v){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs.accent_color=validAccent(v);applyAppearance();render()}function accentTab(v){state.accentTab=v;render()}function setLanguage(v){state.prefs.language=v;applyAppearance();render()}function setAccessibility(key,value){state.prefs[key]=key==='colorblind_mode'?!!value:+value;applyAppearance();const u=$('#uiScaleValue');if(u)u.textContent=state.prefs.ui_scale+'%'}function setCustomColor(hex){if(!/^#[0-9a-f]{6}$/i.test(hex))return;state.accentSource='custom';localStorage.setItem('sp_accent_source','custom');state.prefs.accent_color=hex.toUpperCase();applyAppearance();const p=$('#huePreview'),r=$('#rgbR'),g=$('#rgbG'),b=$('#rgbB');if(p)p.textContent=state.prefs.accent_color;if(r)r.value=parseInt(hex.slice(1,3),16);if(g)g.value=parseInt(hex.slice(3,5),16);if(b)b.value=parseInt(hex.slice(5,7),16)}
function setRgbColor(){const clamp=v=>Math.max(0,Math.min(255,parseInt(v)||0)),r=clamp($('#rgbR')?.value),g=clamp($('#rgbG')?.value),b=clamp($('#rgbB')?.value),hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();setCustomColor(hex)}
function customHue(v){state.accentSource='custom';localStorage.setItem('sp_accent_source','custom');state.prefs.accent_color=hueToHex(+v);applyAppearance();const p=$('#huePreview');if(p)p.textContent=state.prefs.accent_color}function resetPrefs(){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs={...DEFAULT_PREFS};applyAppearance();render()}
async function savePreferences(){try{await api('/tables/user_preferences','POST',{data:{language:state.prefs.language,display_mode:state.prefs.display_mode,accent_color:state.prefs.accent_color,ui_scale:state.prefs.ui_scale,colorblind_mode:state.prefs.colorblind_mode}});const m=$('#appearanceMsg');m.style.color='var(--accent)';m.textContent='Настройки сохранены'}catch(e){$('#appearanceMsg').textContent=e.message}}
async function saveProfile(){try{await api(`/tables/students/${state.me.student_id}`,'PATCH',{data:{full_name:$('#setName').value.trim(),group_name:$('#setGroup').value.trim()||null}});$('#profileMsg').style.color='var(--accent)';$('#profileMsg').textContent='Сохранено';await refresh()}catch(e){$('#profileMsg').textContent=e.message}}
async function deleteAccount(){if(!confirm('Удалить аккаунт и все связанные академические данные? Это действие нельзя отменить.'))return;try{await api('/account/delete','POST',{confirm:true});sessionStorage.removeItem('sp_token');state.token='';alert('Аккаунт удалён.');location.reload()}catch(e){alert('Аккаунт не удалён: '+e.message)}}async function logout(){try{await api('/auth/logout','POST')}catch{}sessionStorage.removeItem('sp_token');state.token='';location.reload()}
bootstrap();
</script></body></html>
