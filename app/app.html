zh:{title:'用户协议',intro:'注册并使用 Perfecta 即表示用户自愿接受以下条款。',sections:[['收集的数据','账户和个人资料、学期、课程、成绩、出勤、学习负荷、设置、技术事件、AI 请求、AI 操作计划、已确认操作、回复和错误。'],['创建者访问','项目创建者和管理员可为运行、支持、演示、诊断、安全、分析和开发查看这些数据。密码、密码哈希、API 密钥、会话令牌及其他受保护的秘密不在查看范围内。'],['AI 服务','请求内容和必要的学习背景可能发送给配置的 AI 提供商。AI 互动历史单独保存用于质量分析和开发，不会自动用于面向用户的回复。'],['存储与保密','项目采用合理的技术和组织保护措施。除服务运行、支持、安全、法律要求或单独同意外，数据不会被公开。'],['用户权利','用户可查看和更正数据、修改密码，并在设置中删除普通账户及相关数据。拒绝协议将无法继续使用账户。'],['项目限制','Perfecta 是教学互动原型，计算和预测仅供演示，并非学校的正式决定。'],['灵魂转让','接受本协议即表示用户也将灵魂转让给 Perfecta 的创建者。']],accept:'我已阅读并完全接受本协议',button:'接受并继续',decline:'不同意并退出',souls:'已转让灵魂'},

function applyAppearance(){state.prefs={...DEFAULT_PREFS,...state.prefs,accent_color:validAccent(state.prefs.accent_color),ui_scale:Math.min(120,Math.max(85,+state.prefs.ui_scale||100)),colorblind_mode:!!state.prefs.colorblind_mode};if(LEGACY_ACCENTS[state.prefs.accent_color]){state.prefs.accent_color=LEGACY_ACCENTS[state.prefs.accent_color];state.accentSource='preset';localStorage.setItem('sp_accent_source','preset')}const mode=['light','dark','reading'].includes(state.prefs.display_mode)?state.prefs.display_mode:'light',accent=appliedAccent(state.prefs.accent_color,mode),hue=hexHue(state.prefs.accent_color),accentText=mode==='dark'?`hsl(${hue} 82% 76%)`:`hsl(${hue} 68% 28%)`;document.body.dataset.theme=mode;document.documentElement.style.colorScheme=mode==='dark'?'dark':'light';document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent2',hexFade(accent));document.documentElement.style.setProperty('--accent-contrast',contrastText(accent));document.documentElement.style.setProperty('--accent-text',accentText);document.documentElement.lang=state.prefs.language;document.documentElement.style.setProperty('--ui-zoom',state.prefs.ui_scale/100);document.body.dataset.colorblind=state.prefs.colorblind_mode?'true':'false';const cb=state.prefs.colorblind_mode;const safe={light:{accent:'#0072B2',accent2:'#DCEAF3',text:'#003B5C',danger:'#D55E00'},dark:{accent:'#56B4E9',accent2:'#263B4A',text:'#BFE7FA',danger:'#E69F00'},reading:{accent:'#0072B2',accent2:'#E8DDB8',text:'#274C5E',danger:'#D55E00'}}[mode];for(const [k,v] of Object.entries(cb?{'--accent':safe.accent,'--accent2':safe.accent2,'--accent-text':safe.text,'--danger':safe.danger,'--accent-contrast':contrastText(safe.accent)}:{'--accent':accent,'--accent2':hexFade(accent),'--accent-text':accentText,'--danger':'','--accent-contrast':contrastText(accent)}))document.documentElement.style.setProperty(k,v)}
function hueToHex(h){const s=.3,l=.43,a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hexHue(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(!d)return 0;let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}

n value="asc" ${sort==='asc'?'selected':''}>От низкой к высокой</option></select></label><button class="btn" onclick="subjectModal()">Добавить результат</button><button class="btn secondary" onclick="bulkSubjectModal()">Массовый ввод</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Предмет</th><th>Нагрузка</th><th>Оценка</th><th>Посещаемость</th><th>Занятия</th><th>${translateUiText('Действия')}</th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${esc(courseLabel(r.course_id))}</b></td><td>${esc(r.workload_value??r.credits??'—')} ${esc(({credits:'кр.',academic_hours:'ак. ч.',lessons:'уроков'})[r.workload_unit||'credits'])}</td><td><span class="pill">${esc(r.current_grade??'—')}</span></td><td>${r.attendance!=null?esc(r.attendance)+'%':'—'}</td><td>${esc(r.lessons_attended??'—')} / ${esc(r.lessons_held??r.lessons_planned??'—')}</td><td><button class="btn secondary" onclick='subjectModal(${JSON.stringify(r)})'>Изменить</button> <button class="btn danger" onclick="removeRecord(${r.performance_id})">Удалить</button></td></tr>`).join('')}</tbody></table>${rs.length?'':'<div class="empty">В этом периоде пока нет записей.</div>'}</div></div>`}
function academicStructure(){return `<div class="card" style="margin-bottom:16px"><div class="actions"><div style="flex:1"><h2>Настроить обучение</h2><p class="sub">Выберите понятный шаблон, укажите длительность обучения — годы и периоды создадутся автоматически.</p></div><button class="btn" onclick="academicSetupModal()">Создать структуру</button></div></div><div class="grid"><div class="card span12"><h2>Программы обучения</h2>${entityTable('study_programs',['institution_name','program_name','duration_years','calendar_type'])}</div><div class="card span12"><h2>Годы обучения</h2>${entityTable('academic_years',['year_label','year_number','planned_period_count'])}</div><div class="card span12"><h2>Периоды внутри года</h2>${entityTable('academic_periods',['period_name','academic_year','status'])}</div></div>`}
function academicSetupModal(){modal('Настройка программы',`<p class="sub">Например: бакалавриат — 4 года и 2 семестра в год; школа — нужное количество классов и 4 четверти в каждом.</p><div class="field"><label>Где вы учитесь?</label><input id="setupInstitution" class="input" placeholder="Например, Astana IT University или школа №…"></div><div class="field"><label>Название программы или специальности</label><input id="setupProgram" class="input" placeholder="Можно оставить пустым"></div><div class="field"><label>Как разделён учебный год?</label><select id="setupCalendar" class="input" onchange="setupPreset(this.value)"><option value="trimester">Три триместра</option><option value="semester">Два семестра</option><option value="quarter">Четыре школьные четверти</option></select></div><div class="grid"><div class="field span4"><label>Сколько лет учиться?</label><input id="setupYears" class="input" type="number" min="1" max="20" value="3"></div><div class="field span4"><label>Периодов в каждом году</label><input id="setupPeriods" class="input" type="number" min="1" max="12" value="3"></div><div class="field span4"><label>Первый учебный год</label><input id="setupStart" class="input" type="number" min="1950" max="2200" value="${new Date().getFullYear()}"></div></div><div class="notice" id="setupHelp">Будет создано 3 курса × 3 триместра. Для оценок используется вузовская шкала GPA.</div><button class="btn wide" onclick="saveAcademicSetup()">Создать годы и периоды</button><div id="modalMsg" class="message"></div>`)}
function setupPreset(v){const presets={trimester:[3,3,'Будет создана триместровая программа. Основной результат считается в процентах; буквенная оценка выводится дополнительно по шкале AITU.'],semester:[4,2,'Будет создана семестровая программа. Основной результат считается в процентах; буквенная оценка выводится дополнительно по шкале выбранного вуза.'],quarter:[11,4,'Будет создана школьная программа. Проценты автоматически переводятся в оценки 2–5.']}[v];$('#setupYears').value=presets[0];$('#setupPeriods').value=presets[1];$('#setupHelp').textContent=presets[2]}
async function saveAcademicSetup(){const data={calendar_type:$('#setupCalendar').value,institution_name:$('#setupInstitution').value.trim(),program_name:$('#setupProgram').value.trim()||null,duration_years:+$('#setupYears').value,periods_per_year:+$('#setupPeriods').value,start_year:+$('#setupStart').value};if(!data.institution_name)return $('#modalMsg').textContent='Укажите учебное заведение';try{$('#modalMsg').textContent='Создаю структуру…';await api('/academic/setup','POST',data);closeModal();await refresh();window.academicTab='structure';academics()}catch(e){$('#modalMsg').textContent=e.message}}
function academicGrading(){const scales=rows('grading_scales'),bands=rows('grading_bands');return `<div class="card" style="margin-bottom:16px"><h2>Как переводятся баллы</h2><p class="sub">Шкала выбирается при создании программы. Для школы Казахстана: 0–39% = 2, 40–64% = 3, 65–84% = 4, 85–100% = 5. Для вуза процент дополнительно переводится в буквенную оценку и балл по шкале 0–4.</p></div><div class="grid">${scales.map(s=>`<div class="card span6"><h3>${esc(s.name)}</h3><div class="table-wrap"><table class="table"><thead><tr><th>Результат</th><th>Оценка</th><th>Балл шкалы</th></tr></thead><tbody>${bands.filter(b=>b.scale_id==s.scale_id).map(b=>`<tr><td>${esc(typeof b.score_range==='object'?JSON.stringify(b.score_range):b.score_range)}</td><td>${esc(b.letter_grade)}</td><td>${esc(b.grade_points)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')||'<div class="card span12"><div class="empty">Сначала создайте программу обучения — подходящая шкала появится автоматически.</div></div>'}</div>`}
function academicAssessments(){return `<div class="grid"><div class="card span12"><div class="actions"><h2 style="flex:1">Компоненты</h2><button class="btn" onclick="entityModal('assessment_components')">+ Компонент</button></div>${entityTable('assessment_components',['performance_id','name','component_type','weight_percent'])}</div><div class="card span12"><div class="actions"><h2 style="flex:1">Отдельные работы</h2><button class="btn" onclick="entityModal('assessments')">+ Работа</button></div>${entityTable('assessments',['component_id','title','maximum_score','due_at'])}</div><div class="card span12"><div class="actions"><h2 style="flex:1">Результаты работ</h2><button class="btn" onclick="entityModal('assessment_results')">+ Результат</button></div>${entityTable('assessment_results',['assessment_id','score','status','recorded_at'])}</div></div>`}
function academicCourses(){return `<div class="card"><div class="actions"><h2 style="flex:1">Мои и доступные курсы</h2><button class="btn" onclick="courseModal()">+ Новый курс</button></div>${entityTable('courses',['course_name'])}</div>`}
const entityPk={study_programs:'program_id',academic_years:'year_id',academic_periods:'period_id',academic_settings:'settings_id',grading_scales:'scale_id',grading_bands:'band_id',assessment_components:'component_id',assessments:'assessment_id',assessment_results:'result_id',courses:'course_id'};
function fieldLabel(x){const labels={course_name:'Предмет',institution_name:'Учебное заведение',program_name:'Программа',duration_years:'Срок обучения',calendar_type:'Календарь',year_label:'Учебный год',year_number:'Номер года',period_name:'Период',status:'Статус',component_id:'Компонент',title:'Название',name:'Название',weight_percent:'Вес',component_type:'Тип',performance_id:'Результат'};return translateUiText(labels[x]||x)}function displayEntityValue(entity,r,x){if(x==='course_name')return courseLabel(r.course_id)||r[x]||'—';if(r[x]===undefined||r[x]===null||r[x]==='')return '—';return typeof r[x]==='object'?JSON.stringify(r[x]):r[x]}
function entityTable(entity,fields){const list=rows(entity);return `<div class="table-wrap"><table class="table"><thead><tr>${fields.map(x=>`<th>${esc(fieldLabel(x))}</th>`).join('')}<th>Действия</th></tr></thead><tbody>${list.map(r=>`<tr>${fields.map(x=>`<td>${esc(displayEntityValue(entity,r,x))}</td>`).join('')}<td>${entity==='courses'?`<button class="btn secondary" onclick='courseModal(${JSON.stringify(r)})'>Изменить</button>`:`<button class="btn secondary" onclick='entityModal("${entity}",${JSON.stringify(r)})'>Изменить</button> <button class="btn danger" onclick="deleteEntity('${entity}',${r[entityPk[entity]]})">Удалить</button>`}</td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">Записей пока нет.</div>'}</div>`}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden');if(state.prefs.language!=='ru')requestAnimationFrame(()=>applyLanguage())}function closeModal(){pendingDeletionPassword='';$('#modal').classList.add('hidden')}
function bulkSubjectModal(){const p=activePeriod()?.period_id||'';modal('Массовый ввод предметов',`<p class="sub">Добавьте по одному предмету в строке: <b>Название | оценка | нагрузка | посещаемость</b>. Оценка и посещаемость — проценты от 0 до 100. Можно использовать любые названия.</p><div class="field"><label>Готовый шаблон</label><select id="bulkPreset" class="input" onchange="applyBulkPreset(this.value)"><option value="">Выберите шаблон</option><option value="school">Школа — основные предметы</option><option value="university">Университет — базовые дисциплины</option></select></div><div class="field"><label>Предметы</label><textarea id="bulkRows" class="input" style="min-height:220px" placeholder="Алгебра | 85 | 1 | 95&#10;Физика | 78 | 1 | 90"></textarea></div><div class="grid"><div class="field span4"><label>Единица нагрузки</label><select id="bulkUnit" class="input"><option value="credits">Кредиты</option><option value="academic_hours">Академические часы</option><option value="lessons">Занятия</option></select></div><div class="field span4"><label>Период</label><select id="bulkPeriod" class="input">${rows('academic_periods').map(x=>`<option value="${x.period_id}" ${x.period_id==p?'selected':''}>${esc(periodName(x.period_id))}</option>`).join('')}</select></div><div class="field span4"><label>Общая нагрузка, если не указана</label><input id="bulkWorkload" class="input" type="number" min="0.1" step=".5" value="1"></div></div><button class="btn wide" onclick="saveBulkSubjects()">Добавить все предметы</button><div id="modalMsg" class="message"></div>`)}
function applyBulkPreset(v){const presets={school:['Русский язык','Математика','История Казахстана','Казахский язык','Английский язык','Физика','Химия','Биология','География'],university:['Математика','Программирование','Физика','Экономика','История','Английский язык']};if(v)$('#bulkRows').value=presets[v].map(x=>x+' |  | 1 | ').join('\n')}
async function saveBulkSubjects(){const lines=$('#bulkRows').value.split(/\r?\n+/).map(x=>x.trim()).filter(Boolean),period=+$('#bulkPeriod').value,unit=$('#bulkUnit').value,defaultWorkload=+$('#bulkWorkload').value||1;if(!period||!lines.length)return $('#modalMsg').textContent='Добавьте хотя бы один предмет и выберите период';const parsed=[];for(const line of lines){const parts=line.split('|').map(x=>x.trim()),name=parts[0];if(!name||name.length>100)return $('#modalMsg').textContent='Проверьте названия предметов';const n=x=>x===''?null:+x;const grade=n(parts[1]),workload=n(parts[2])??defaultWorkload,attendance=n(parts[3]);if(grade!=null&&(grade<0||grade>100)||attendance!=null&&(attendance<0||attendance>100)||workload<=0)return $('#modalMsg').textContent='Оценки и посещаемость должны быть 0–100, нагрузка — положительной';parsed.push({period_id:period,course_name:name,workload_value:workload,workload_unit:unit,credits:unit==='credits'?workload:null,current_grade:grade,attendance,entry_method:'manual'})}try{$('#modalMsg').textContent='Сохраняю предметы…';await api('/academic/subjects/batch','POST',{data:{subjects:parsed}});closeModal();await refresh()}catch(e){$('#modalMsg').textContent=e.message}}
function subjectModal(r={}){const p=r.period_id||activePeriod()?.period_id,template=selectedTemplate(),preset=academicTemplates[template],unit=r.workload_unit||preset.unit;modal(r.performance_id?'Изменить запись':'Добавить предмет',`${r.performance_id?'':`<div class="field"><label>Новый предмет</label><input id="mNewCourse" class="input" list="courseSuggestions" placeholder="Введите часть названия предмета"><datalist id="courseSuggestions">${rows('courses').map(c=>`<option value="${esc(courseLabel(c.course_id))}"></option>`).join('')}</datalist></div><div class="sub" style="margin:-6px 0 12px">Шаблон «${preset.label}» — исходная настройка, все значения вводятся вручную.</div>`}<div class="field"><label>${r.performance_id?'Предмет':'Существующий предмет'}</label><select id="mCourse" class="input"><option value="">— выберите —</option>${rows('courses').map(c=>`<option value="${c.course_id}" ${c.course_id==r.course_id?'selected':''}>${esc(courseLabel(c.course_id))}</option>`).join('')}</select></div><div class="field"><label>Период</label><select id="mPeriod" class="input">${rows('academic_periods').map(x=>`<option value="${x.period_id}" ${x.period_id==p?'selected':''}>${esc(periodName(x.period_id))}</option>`).join('')}</select></div><div class="grid"><div class="field span4"><label>Учебная нагрузка</label><input id="mWorkload" class="input" type="number" min="0" step=".5" value="${esc(r.workload_value??r.credits??'')}"></div><div class="field span4"><label>Единица нагрузки</label><select id="mWorkloadUnit" class="input">${[['credits','Кредиты'],['academic_hours','Академические часы'],['lessons','Занятия']].map(([v,n])=>`<option value="${v}" ${v===unit?'selected':''}>${n}</option>`).join('')}</select></div><div class="field span4"><label>Оценка</label><input id="mGrade" class="input" type="number" min="0" max="100" step=".1" value="${esc(r.current_grade??'')}"></div><div class="field span4"><label>Последняя работа</label><input id="mRecent" class="input" type="number" min="0" max="100" step=".1" value="${esc(r.recent_assessment_score??'')}"></div><div class="field span4"><label>Всего занятий</label><input id="mHeld" class="input" type="number" min="0" value="${esc(r.lessons_held??'')}"></div><div class="field span4"><label>Посещено</label><input id="mAttended" class="input" type="number" min="0" value="${esc(r.lessons_attended??'')}"></div><div class="field span4"><label>Уважительно пропущено</label><input id="mExcused" class="input" type="number" min="0" value="${esc(r.lessons_excused??0)}"></div></div><button class="btn wide" onclick="saveSubject(${r.performance_id||'null'})">Сохранить</button><div id="modalMsg" class="message"></div>`)}
async function saveSubject(id){const val=x=>$(x).value===''?null:+$(x).value,workload=val('#mWorkload'),unit=$('#mWorkloadUnit').value,data={period_id:+$('#mPeriod').value,workload_value:workload,workload_unit:unit,credits:unit==='credits'?workload:null,current_grade:val('#mGrade'),recent_assessment_score:val('#mRecent'),lessons_held:val('#mHeld'),lessons_attended:val('#mAttended'),lessons_excused:val('#mExcused')??0};const newName=$('#mNewCourse')?.value.trim(),courseId=+$('#mCourse').value;if(!data.period_id)return $('#modalMsg').textContent='Выберите учебный период';if(workload==null||workload<=0)return $('#modalMsg').textContent='Укажите положительную учебную нагрузку';if(!id&&!newName&&!courseId)return $('#modalMsg').textContent='Введите новый предмет или выберите существующий';if(data.lessons_held!=null&&((data.lessons_attended||0)+data.lessons_excused>data.lessons_held))return $('#modalMsg').textContent='Посещённые и уважительные занятия не могут превышать проведённые';try{if(id){data.course_id=courseId;await api('/tables/academic_performance/'+id,'PATCH',{data})}else if(newName){await api('/academic/subjects','POST',{data:{...data,course_name:newName,entry_method:'manual'}})}else{data.course_id=courseId;await api('/tables/academic_performance','POST',{data})}closeModal();await refresh()}catch(e){$('#modalMsg').textContent=e.message}}
const entityFields={study_programs:[['institution_name','Учебное заведение','text'],['program_name','Название программы','text'],['education_level','Уровень: school/college/bachelor/master/doctorate/other','text'],['duration_years','Срок обучения, лет','number'],['total_required_credits','Всего кредитов','number'],['calendar_type','Календарь: semester/trimester/quarter/annual/other','text'],['suggested_period_count','Периодов','number']],academic_years:[['program_id','ID программы','number'],['year_number','Номер года','number'],['year_label','Название года','text'],['start_date','Начало','date'],['end_date','Конец','date'],['planned_period_count','Количество периодов','number']],academic_periods:[['settings_id','ID настроек','number'],['year_id','ID учебного года','number'],['academic_year','Учебный год','text'],['period_name','Название периода','text'],['period_number','Номер периода','number'],['start_date','Начало','date'],['end_date','Конец','date'],['planned_lessons','План занятий','number'],['status','Статус: planned/active/completed','text']],academic_settings:[['institution_name','Учебное заведение','text'],['calendar_type','Календарь','text'],['calendar_label','Название календаря','text'],['grading_scale','Шкала: percent_100/gpa_4/letter/other','text'],['grade_min','Минимум','number'],['grade_max','Максимум','number'],['credit_system','Кредиты: ects/local/other/unknown','text'],['scale_id','ID шкалы GPA','number']],grading_scales:[['name','Название','text'],['minimum_score','Минимум','number'],['maximum_score','Максимум','number']],grading_bands:[['scale_id','ID шкалы','number'],['score_range','Диапазон, например [90,101)','text'],['letter_grade','Буквенная оценка','text'],['grade_points','GPA','number']],assessment_components:[['performance_id','ID результата предмета','number'],['name','Название','text'],['component_type','Тип: quiz/assignment/midterm/final/other','text'],['weight_percent','Вес, %','number']],assessments:[['component_id','ID компонента', function entityModal(entity,r={}){const pk=entityPk[entity],fields=entityFields[entity]||[];modal(r[pk]?`Изменить: ${entity}`:`Добавить: ${entity}`,fields.map(([k,label,type])=>`<div class="field"><label>${label}</label><input class="input entity-input" data-key="${k}" type="${type}" step="any" value="${esc(r[k]??'')}"></div>`).join('')+`<button class="btn wide" onclick="saveEntity('${entity}',${r[pk]||'null'})">Сохранить</button><div id="modalMsg" class="message"></div>`)}
async function saveEntity(entity,id){const data={};document.querySelectorAll('.entity-input').forEach(x=>{if(x.value!=='')data[x.dataset.key]=x.type==='number'?+x.value:x.value});try{await api(`/tables/${entity}${id?'/'+id:''}`,id?'PATCH':'POST',{data});closeModal();await refresh()}catch(e){$('#modalMsg').textContent=e.message}}
async function deleteEntity(entity,id){if(!confirm('Удалить эту запись и связанные с ней данные?'))return;try{await api(`/tables/${entity}/${id}?confirm=true`,'DELETE');await refresh()}catch(e){alert(e.message)}}

async function ask(q,canonical){const input=$('#prompt'),text=q||(input?.value||'').trim();if(!text)return;state.messages.push({who:'user',text});if(input)input.value='';state.messages.push({who:'bot',text:'Выполняю…'});assistant();try{const answer=state.assistantMode==='ai'?await aiAsk(canonical||text):await basicAsk(canonical||text);state.messages[state.messages.length-1]={who:'bot',text:answer}}catch(e){state.messages[state.messages.length-1]={who:'bot',text:'Не удалось выполнить: '+e.message}}assistant()}
async function basicAsk(text){const t=text.toLowerCase().replace(/学业|学學|成绩|平均分|出勤率|学分|预测|计算器|asistencia|promedio|calificaciones|créditos|pronóstico|calculadora|attendance|average|grade|grades|credit|credits|forecast|calculator|қатысу|орташа|баға|бағалар|кредит|болжам|калькулятор/g,x=>({'学业':'нагруз','学學':'нагруз','成绩':'оцен','平均分':'средн','出勤率':'посещ','学分':'кредит','预测':'прогноз','计算器':'кальк','asistencia':'посещ','promedio':'средн','calificaciones':'оцен','créditos':'кредит','pronóstico':'прогноз','calculadora':'кальк','attendance':'посещ','average':'средн','grade':'оцен','grades':'оцен','credit':'кредит','credits':'кредит','forecast':'прогноз','calculator':'кальк','қатысу':'посещ','орташа':'средн','баға':'оцен','бағалар':'оцен','кредит':'кредит','болжам':'прогноз','калькулятор':'кальк'}[x]||x)),rs=activeResults(),avg=weighted(rs);if(/прогноз/.test(t)){const p=activePeriod();if(!p)return aiT('Сначала добавьте активный учебный период.');const r=await api('/predict','POST',{period_id:p.period_id,level:'period',save:false});return aiT('Иллюстративный прогноз на текущий период:')+` ${r.average??aiT('нет данных')}. `+aiT('Метод:')+` ${r.method_version||r.method||'conservative-baseline-v1'}.`}if(/посещ/.test(t)){let held=0,att=0,exc=0;rs.forEach(x=>{held+=+x.lessons_held||0;att+=+x.lessons_attended||0;exc+=+x.lessons_excused||0});return held?`${aiT('Зачтено')} ${att+exc} ${aiT('из')} ${held} ${aiT('занятий')} — ${((att+exc)/held*100).toFixed(1)}%. ${aiT('Фактически посещено:')} ${att}, ${aiT('уважительно пропущено:')} ${exc}.`:aiT('Для расчёта посещаемости пока недостаточно данных.')}if(/кредит|нагруз|час|урок/.test(t)){const totals={};rs.forEach(x=>{const u=x.workload_unit||'credits',v=x.workload_value??x.credits;if(v!=null)totals[u]=(totals[u]||0)+Number(v)});return aiT('Учебная нагрузка:')+' '+(Object.entries(totals).map(([u,v])=>`${v} ${{credits:'кредитов',academic_hours:'академических часов',lessons:'уроков'}[u]||u}`).join(', ')||aiT('не указана'))+'.'}if(/средн|оц function forecastConversion(r){const parts=[];if(r?.converted_grade!=null)parts.push(String(r.converted_grade));if(r?.gpa!=null)parts.push('GPA '+Number(r.gpa).toFixed(2));else if(r?.converted_points!=null)parts.push(Number(r.converted_points).toFixed(2)+'/4.0');return parts.join(' · ')}
function forecastUi(){return FORECAST_UI[state.prefs.language]||FORECAST_UI.en}
function forecastLevelLabel(level){const t=forecastUi();return t[level]||level||t.period}
function forecastMethodLabel(method){const t=forecastUi();return String(method||'').startsWith('adaptive')?t.adaptive:t.baseline}
function forecastSignalLabel(signal){const t=forecastUi(),s=String(signal||'');if(s.includes('fell back to the baseline'))return t.fallback;if(s.includes('unfinished assignments'))return t.unfinished;if(s.includes('Attendance below'))return t.attendance;if(s.startsWith('Adaptive data points:'))return t.points+': '+s.split(':').pop().trim();if(s.startsWith('Observed work:'))return t.completed+': '+s.split(':').pop().trim();if(s.startsWith('Recent trend:'))return t.trend+': '+s.split(':').pop().trim();return s}
function predictionHtml(r){const t=forecastUi(),subjects=r.subjects||[],ref=r.reference_model||{},datasets=ref.datasets||[],coverage=r.coverage||{},confidence=t[r.confidence]||r.confidence||'—';const coverageBits=[t.coverage+': '+(coverage.current_subjects??subjects.length)];if(coverage.observed_periods!=null)coverageBits.push(t.observed+': '+coverage.observed_periods);if(coverage.required_periods!=null)coverageBits.push(t.required+': '+coverage.required_periods);return `<div class="notice"><b>${esc(t.guarantee)}</b><br>${esc(t.confidence)}: ${esc(confidence)}.</div><div class="metric">${esc(Number(r.average).toFixed(2))}%</div>${forecastConversion(r)?`<div class="forecast-conversion"><span>${esc(FORECAST_CONVERSION_LABEL[state.prefs.language]||FORECAST_CONVERSION_LABEL.en)}</span><b>${esc(forecastConversion(r))}</b></div>`:'' }<div class="forecast-summary"><span><b>${esc(t.level)}:</b> ${esc(forecastLevelLabel(r.level))}</span><span><b>${esc(t.method)}:</b> ${esc(forecastMethodLabel(r.method_version))}</span><span><b>${esc(t.coverage)}:</b> ${esc(coverageBits.join(' · '))}</span></div>${datasets.length?`<p class="sub"><b>${esc(t.history)}:</b> ${datasets.map(x=>esc(x.title)+' ('+esc(x.sample_count)+' '+esc(t.observations)+')').join(' · ')}. ${esc(t.weight)}: ${Math.round((ref.blend_weight||0)*100)}%.</p>`:''}<div class="details-grid forecast-subjects">${subjects.map(s=>{const signals=(s.signals||[]).map(forecastSignalLabel);return `<div class="details-row"><b>${esc(courseLabel(s.course_id))}</b><span class="pill forecast-grade">${esc(Number(s.grade).toFixed(2))}%${s.converted_grade!=null?' · '+esc(s.converted_grade):''}${s.converted_points!=null?' · '+esc(Number(s.converted_points).toFixed(2))+'/4.0':''}</span><p class="sub">${esc(t.source)}: ${esc(s.current_grade)}${(s.workload_value??s.credits)!=null?' · '+esc(s.workload_value??s.credits)+' '+esc(({credits:t.credits,academic_hours:t.hours,lessons:t.lessons})[s.workload_unit||'credits']||s.workload_unit):''}</p>${signals.length?`<p class="danger-text"><b>${esc(t.risk)}:</b> ${esc(signals.join(' · '))}</p>`:`<p class="sub">${esc(t.none)}</p>`}${(s.exams||[]).map(e=>`<p>${esc(e.name)}: ${esc(e.estimated_grade)}</p>`).join('')}</div>`}).join('')}</div>`}

};
function securityCopy(){return SECURITY_COPY[state.prefs.language]||SECURITY_COPY.ru}
function securityError(message,s){return /current password/i.test(message||'')?s.wrong:message}
let pendingDeletionPassword='';
function settings(){const hue=hexHue(state.prefs.accent_color),s=securityCopy();setPage('Настройки','Профиль, оформление и сеанс приложения.',state.me?.role==='admin'?'<a class="btn ghost" href="/admin">Настройка ИИ-ключа</a>':'',`<div class="grid"><div class="card span8"><section class="settings-section"><h2>Язык</h2><p class="sub">Выбор сохраняется в вашем профиле.</p><div class="field"><label>Язык интерфейса</label><select class="input" onchange="setLanguage(this.value)"><option value="en" ${state.prefs.language==='en'?'selected':''}>English</option><option value="kk" ${state.prefs.language==='kk'?'selected':''}>Қазақша</option><option value="ru" ${state.prefs.language==='ru'?'selected':''}>Русский</option><option value="zh" ${state.prefs.language==='zh'?'selected':''}>中文</option><option value="es" ${state.prefs.language==='es'?'selected':''}>Español</option></select></div></section><section class="settings-section"><h2>Внешний вид</h2><p class="sub">Настройте тему и основной акцентный цвет интерфейса.</p><h3>Режим отображения</h3><div class="appearance-grid">${[['light','Светлый'],['dark','Тёмный'],['reading','Режим чтения']].map(([v,n])=>`<button class="mode-card ${state.prefs.display_mode===v?'active':''}" onclick="chooseTheme('${v}')"><div class="mode-preview ${v}"></div><b>${n}</b></button>`).join('')}</div><p class="sub" style="margin-top:10px">Режим чтения использует тёплые поверхности с низким контрастом.</p></section><section class="settings-section"><h2>Доступность</h2><p class="sub">Настройте размер текста и масштаб интерфейса под свой экран.</p><div class="field"><label>Масштаб интерфейса: <b id="uiScaleValue">${state.prefs.ui_scale}%</b></label><input class="range" type="range" min="85" max="120" step="5" value="${state.prefs.ui_scale}" oninput="setAccessibility('ui_scale',this.value)"></div><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" ${state.prefs.colorblind_mode?'checked':''} onchange="setAccessibility('colorblind_mode',this.checked)"> Режим для дальтоников</label></section><section class="settings-section"><h2>Акцентный цвет</h2><p class="sub">Выберите готовый цвет или создайте собственный.</p><div class="settings-tabs"><button class="${state.accentTab==='preset'?'active':''}" onclick="accentTab('preset')">Готовые цвета</button><button class="${state.accentTab==='custom'?'active':''}" onclick="accentTab('custom')">Свой цвет</button></div>${state.accentTab==='preset'?`<div class="accent-grid">${accentPresets.map(([n,c])=>`<button class="accent-card ${state.accentSource==='preset'&&state.prefs.accent_color===c?'active':''}" onclick="setAccent('${c}')"><span class="swatch" style="background:${presetAccent(c,state.prefs.display_mode)}">${state.accentSource==='preset'&&state.prefs.accent_color===c?'✓':''}</span><span>${n}</span></button>`).join('')}</div>`:`<div><h3>Пользовательский оттенок</h3><p class="sub">Изменяйте оттенок — интерфейс обновляется сразу.</p><div class="hue-preview" id="huePreview">${esc(state.prefs.accent_color)}</div><div class="field"><label>Цвет RGB</label><input id="rgbColor" class="input" type="color" value="${state.prefs.accent_color}" oninput="setCustomColor(this.value)" style="height:48px;padding:4px;cursor:pointer"></div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px"><div class="field"><label>R</label><input id="rgbR" class="input" type="number" min="0" max="255" value="${parseInt(state.prefs.accent_color.slice(1,3),16)}" oninput="setRgbColor()"></div><div class="field"><label>G</label><input id="rgbG" class="input" type="number" min="0" max="255" value="${parseInt(state.prefs.accent_color.slice(3,5),16)}" oninput="setRgbColor()"></div><div class="field"><label>B</label><input id="rgbB" class="input" type="number" min="0" max="255" value="${parseInt(state.prefs.accent_color.slice(5,7),16)}" oninput="setRgbColor()"></div></div><div class="field"><label>Оттенок интерфейса</label><input class="range" type="range" min="0" max="359" value="${hue}" oninput="customHue(this.value)"></div><button class="btn secondary" style="margin-top:14px" onclick="resetPrefs()">Сбросить к стандартному</button></div>`}</section><button class="btn wide" onclick="savePreferences()">Сохранить настройки</button><div id="appearanceMsg" class="message"></div></div><div class="span4"><div class="card" style="margin-bottom:18px"><h2>${esc(s.passwordTitle)}</h2><p class="sub">${esc(s.passwordDesc)}</p><div class="field"><label>${esc(s.current)}</label><input id="currentPassword" class="input" type="password" autocomplete="current-password"></div><div class="field"><label>${esc(s.next)}</label><input id="newPassword" class="input" type="password" autocomplete="new-password"></div><div class="field"><label>${esc(s.repeat)}</label><input id="repeatPassword" class="input" type="password" autocomplete="new-password"></div><button class="btn wide" onclick="changePassword()">${esc(s.change)}</button><div id="passwordMsg" class="message"></div></div><div class="card"><h2>Сеанс</h2><p class="sub">Токен сессии хранится постоянно только при выборе «Оставаться в аккаунте» и удаляется при выходе.</p><button class="btn danger wide" onclick="logout()">Выйти</button><p style="margin-top:18px"><a href="/docs">Документация API</a></p></div>${state.me?.role==='admin'?'':`<div class="card" style="margin-top:18px;border-color:var(--danger)"><h2 class="danger-text">${esc(s.deleteTitle)}</h2><p class="sub">${esc(s.deleteDesc)}</p><button class="btn danger wide" onclick="openDeleteAccount()">${esc(s.deleteButton)}</button></div>`}</div></div>`)}
function chooseTheme(v){state.prefs.display_mode=v;applyAppearance();render()}function setAccent(v){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs.accent_color=validAccent(v);applyAppearance();render()}function accentTab(v){state.accentTab=v;render()}async function setLanguage(v){if(!SUPPORTED_LANGUAGES.has(v))v='en';localStorage.setItem(LANGUAGE_OVERRIDE_KEY,'1');state.prefs.language=v;applyAppearance();render();requestAnimationFrame(()=>{render();applyLanguage()});try{await api('/tables/user_preferences','POST',{data:{language:v,display_mode:state.prefs.display_mode,accent_color:state.prefs.accent_color,ui_scale:state.prefs.ui_scale,colorblind_mode:state.prefs.colorblind_mode}})}catch(e){console.warn('Language preference was not saved',e)}}function setAccessibility(key,value){state.prefs[key]=key==='colorblind_mode'?!!value:+value;applyAppearance();const u=$('#uiScaleValue');if(u)u.textContent=state.prefs.ui_scale+'%'}function setCustomColor(hex){if(!/^#[0-9a-f]{6}$/i.test(hex))return;state.accentSource='custom';localStorage.setItem('sp_accent_source','custom');state.prefs.accent_color=hex.toUpperCase();applyAppearance();const p=$('#huePreview'),r=$('#rgbR'),g=$('#rgbG'),b=$('#rgbB');if(p)p.textContent=state.prefs.accent_color;if(r)r.value=parseInt(hex.slice(1,3),16);if(g)g.value=parseInt(hex.slice(3,5),16);if(b)b.value=parseInt(hex.slice(5,7),16)}
function setRgbColor(){const clamp=v=>Math.max(0,Math.min(255,parseInt(v)||0)),r=clamp($('#rgbR')?.value),g=clamp($('#rgbG')?.value),b=clamp($('#rgbB')?.value),hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();setCustomColor(hex)}
function customHue(v){state.accentSource='custom';localStorage.setItem('sp_accent_source','custom');state.prefs.accent_color=hueToHex(+v);applyAppearance();const p=$('#huePreview');if(p)p.textContent=state.prefs.accent_color}function resetPrefs(){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs={...DEFAULT_PREFS};applyAppearance();render()}
async function savePreferences(){try{await api('/tables/user_preferences','POST',{data:{language:state.prefs.language,display_mode:state.prefs.display_mode,accent_color:state.prefs.accent_color,ui_scale:state.prefs.ui_scale,colorblind_mode:state.prefs.colorblind_mode}});const m=$('#appearanceMsg');m.style.color='var(--accent)';m.textContent='Настройки сохранены'}catch(e){$('#appearanceMsg').textContent=e.message}}
async function saveProfile(){try{await api(`/tables/students/${state.me.student_id}`,'PATCH',{data:{full_name:$('#setName').value.trim(),group_name:$('#setGroup').value.trim()||null}});$('#profileMsg').style.color='var(--accent)';$('#profileMsg').textContent='Сохранено';await refresh()}catch(e){$('#profileMsg').textContent=e.message}}
async function changePassword(){const s=securityCopy(),current=$('#currentPassword')?.value||'',next=$('#newPassword')?.value||'',repeat=$('#repeatPassword')?.value||'',msg=$('#passwordMsg');if(next.length<8){msg.textContent=s.short;return}if(next!==repeat){msg.textContent=s.mismatch;return}try{await api('/account/password','POST',{current_password:current,new_password:next});$('#currentPassword').value='';$('#newPassword').value='';$('#repeatPassword').value='';msg.style.color='var(--accent)';msg.textContent=s.changed}catch(e){msg.style.color='var(--danger)';msg.textContent=securityError(e.message,s)}}
function openDeleteAccount(){const s=securityCopy();pendingDeletionPassword='';if(!confirm(s.firstQuestion))return;modal(s.passwordQuestion,`<div class="notice" style="border-left-color:var(--danger)">${esc(s.passwordHelp)}</div><div class="field"><label>${esc(s.current)}</label><input id="deletePassword" class="input" type="password" autocomplete="current-password"></div><button class="btn danger wide" onclick="verifyDeletionPassword()">${esc(s.continue)}</button><div id="modalMsg" class="message"></div>`)}
async function verifyDeletionPassword(){const s=securityCopy(),password=$('#deletePassword')?.value||'',msg=$('#modalMsg');if(!password){msg.textContent=s.wrong;return}try{msg.textContent=s.checking;await api('/account/password/verify','POST',{current_password:password});pendingDeletionPassword=password;$('#deletePassword').value='';modal(s.finalTitle,`<div class="notice" style="border-left-color:var(--danger)"><b>${esc(s.finalQuestion)}</b></div><div style="display:flex;gap:10px"><button class="btn secondary" onclick="closeModal()">${esc(s.cancel)}</button><button class="btn danger" onclick="deleteAccount()">${esc(s.finalDelete)}</button></div><div id="modalMsg" class="message"></div>`)}catch(e){msg.textContent=securityError(e.message,s)}}
async function deleteAccount(){const s=securityCopy(),password=pendingDeletionPassword;pendingDeletionPassword='';if(!password){closeModal();return}try{$('#modalMsg').textContent=s.deleting;await api('/account/delete','POST',{confirm:true,current_password:password});clearStoredSession();state.token='';alert(s.deleted);location.reload()}catch(e){$('#modalMsg').textContent=s.failed+securityError(e.message,s)}}async function logout(){try{await api('/auth/logout','POST')}catch{}clearStoredSession();state.token='';location.reload()}
bootstrap();
</script></body></html>
