<style>

*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,#1a867a 0,transparent 28%),linear-gradient(135deg,#0e192a,#172840)}
.auth-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 70px #0007}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800}.brand b{display:block;font-size:16px}.brand small{color:var(--muted)}h1{font-size:28px;margin:28px 0 8px}h2{font-size:20px;margin:0}h3{margin:0 0 10px}.sub{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:650}.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;color:var(--ink);outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #0f8f8520}textarea.input{min-height:92px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:700}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#edf2f5;color:var(--ink)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--danger)}.wide{width:100%}.switch-auth{text-align:center;margin-top:16px}.link{border:0;background:none;color:var(--accent);font-weight:700}.message{min-height:20px;margin-top:12px;color:var(--danger)}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--side);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.sidebar .brand{padding:0 7px 25px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8c3d2;text-align:left;padding:12px 14px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.nav .admin-only{color:#92e4da}.profile{margin-top:auto;border-top:1px solid #ffffff18;padding:18px 7px 0;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d7f2ee;color:#08756d;font-weight:800}.profile b,.profile small{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile small{color:#91a0b6;margin-top:2px}.main{min-width:0;padding:34px clamp(20px,4vw,56px) 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:26px}.top h1{margin:0 0 8px}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:30px;font-weight:800;margin:12px 0 4px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800;color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--accent2);color:#08756d;font-weight:750;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;color:var(--muted);font-size:12px;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:14px 12px;border-bottom:1px solid var(--line)}.table tr:last-child td{border:0}.table .btn{padding:7px 10px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:18px 0}.toolbar .field{margin:0;min-width:190px}.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.chat-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.chat-side .choice{width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:9px}.chat-side .choice.active{border-color:var(--accent);background:var(--accent2)}.messages{height:430px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}.bubble{max-width:82%;padding:12px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}.bubble.bot{align-self:flex-start;background:#edf2f5;border-bottom-left-radius:4px}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.composer textarea{min-height:52px;max-height:140px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;color:var(--muted)}
.calc-rows{display:grid;gap:8px}.calc-row{display:grid;grid-template-columns:1fr 130px 120px 40px;gap:8px}.result{background:linear-gradient(135deg,#0c8178,#135f72);color:#fff}.result .metric{font-size:42px}.modal{position:fixed;inset:0;background:#06101dbb;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;border-radius:18px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.icon-btn{border:0;background:#edf2f5;border-radius:50%;width:35px;height:35px}.notice{border-left:4px solid var(--accent);background:#edf9f7;padding:12px 14px;border-radius:8px;line-height:1.5}.danger-text{color:var(--danger)}
.sidebar{background:var(--side);color:var(--side-ink);border-right:1px solid var(--line)}.nav button{color:var(--muted)}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}.nav .admin-only{color:var(--accent)}.profile{border-color:var(--line)}.profile small{color:var(--muted)}.avatar{background:var(--accent2);color:var(--accent)}.pill{color:var(--accent)}
body[data-theme="dark"]{--ink:#e5edf7;--muted:#9caabd;--bg:#0f1725;--card:#172238;--line:#2a3950;--side:#111a2a;--side-ink:#f0f5fb;--shadow:0 16px 38px rgba(0,0,0,.2)}body[data-theme="reading"]{--ink:#342f28;--muted:#766e62;--bg:#f3ede2;--card:#fffaf0;--line:#ded3c1;--side:#fffaf0;--side-ink:#342f28;--shadow:0 14px 34px rgba(84,69,43,.08)}body{transition:background-color .2s,color .2s}body[data-theme="dark"] .input,body[data-theme="dark"] .choice,body[data-theme="dark"] .quick button{background:#101b2d;color:var(--ink);border-color:var(--line)}body[data-theme="dark"] .btn.secondary{background:#243249;color:var(--ink)}body[data-theme="dark"] .bubble.bot{background:#243249}body[data-theme="dark"] .modal-card{background:var(--card)}body[data-theme="reading"] .btn.secondary{background:#eee5d7;color:var(--ink)}body[data-theme="reading"] .bubble.bot{background:#eee5d7}
.appearance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode-card,.accent-card{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px;text-align:left}.mode-card.active,.accent-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}.mode-preview{height:52px;border-radius:8px;margin-bottom:9px;border:1px solid #0001}.mode-preview.light{background:linear-gradient(90deg,#fff 0 30%,#f1f5f9 30%)}.mode-preview.dark{background:linear-gradient(90deg,#111a2a 0 30%,#0f1725 30%)}.mode-preview.reading{background:linear-gradient(90deg,#fffaf0 0 30%,#f3ede2 30%)}.accent-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.accent-card{text-align:center;padding:10px 4px}.swatch{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin:0 auto 7px;color:#fff;font-weight:800}.settings-section{margin-bottom:18px}.settings-section h2{margin-bottom:7px}.settings-tabs{display:flex;gap:8px;margin:14px 0}.settings-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px}.settings-tabs button.active{background:var(--accent2);color:var(--accent);border-color:var(--accent)}.hue-preview{height:76px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}.range{width:100%;accent-color:var(--accent)}
@media(max-width:1000px){.span3{grid-column:span 6}.span4,.span5,.span7,.span8{grid-column:span 12}.chat-layout{grid-template-columns:1fr}.chat-side{display:flex;gap:8px}.chat-side .choice{margin:0}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:14px}.sidebar .brand{padding-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.profile{display:none}.main{padding:22px 14px 40px}.top{display:block}.top .actions{margin-top:14px}.span3{grid-column:span 12}.calc-row{grid-template-columns:1fr 85px 75px 40px}.composer{grid-template-columns:1fr}.table{min-width:620px}.appearance-grid{grid-template-columns:1fr}.accent-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand"><div class="logo">SP</div><div><b>Student Performance</b><small>Prediction System</small></div></div><h1 id="authTitle">Вход</h1><p class="sub" id="authSub">Откройте личные академические данные и инструменты анализа.</p><div id="nameField" class="field hidden"><label>Имя</label><input id="fullName" class="input" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="username"></div><div class="field"><label>Пароль</label><input id="password" class="input" type="password" autocomplete="current-password"></div><button id="authSubmit" class="btn wide">Войти</button><div id="authMessage" class="message" role="status"></div><div class="switch-auth"><span id="switchText">Нет аккаунта?</span> <button id="switchAuth" class="link">Зарегистрироваться</button></div></div></section>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><div class="logo">SP</div><div><b>Student Performance</b><small>Prediction System</small></div></div><nav id="nav" class="nav"><button data-view="dashboard" class="active">Обзор</button><button data-view="academics">Академические данные</button><button data-view="assistant">Помощник</button><button data-view="calculator">Калькулятор</button><button data-view="history">История</button><button data-view="admin" class="admin-only hidden">Режим администратора</button><button data-view="settings">Настройки</button></nav><div class="profile"><div id="avatar" class="avatar">—</div><div><b id="profileName">Студент</b><small id="profileRole">Личный профиль</small></div></div></aside><main id="content" class="main"></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const DEFAULT_PREFS={language:'ru',display_mode:'light',accent_color:'#4F6F8F'};
const state={token:sessionStorage.getItem('sp_token')||'',me:null,data:null,view:'dashboard',register:false,assistantMode:'basic',messages:[],prefs:{...DEFAULT_PREFS},accentTab:'preset'};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{})});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function nameOf(){return state.data?.students?.[0]?.full_name||state.me?.display_name||state.me?.email||'Студент'}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function validAccent(v){return /^#[0-9a-f]{6}$/i.test(v||'')?v.toUpperCase():DEFAULT_PREFS.accent_color}
function hexFade(hex){const h=validAccent(hex);return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},.14)`}
function applyAppearance(){state.prefs={...DEFAULT_PREFS,...state.prefs,accent_color:validAccent(state.prefs.accent_color)};document.body.dataset.theme=state.prefs.display_mode;document.documentElement.style.setProperty('--accent',state.prefs.accent_color);document.documentElement.style.setProperty('--accent2',hexFade(state.prefs.accent_color));document.documentElement.lang=state.prefs.language}
function hueToHex(h){const s=.3,l=.43,a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hexHue(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(!d)return 0;let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}
async function bootstrap(){if(!state.token){applyAppearance();return showAuth()}try{state.me=await api('/me');[state.data,state.prefs]=await Promise.all([api('/data'),api('/preferences')]);state.prefs={...DEFAULT_PREFS,...state.prefs};applyAppearance();$('#profileName').textContent=nameOf();$('#avatar').textContent=initials(nameOf());$('#profileRole').textContent=state.me.role==='admin'?'Администратор':'Личный профиль';$('.admin-only').classList.toggle('hidden',state.me.role!=='admin');$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){sessionStorage.removeItem('sp_token');state.token='';showAuth(e.message)}}
function showAuth(message=''){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');$('#authMessage').textContent=message}
$('#switchAuth').onclick=()=>{state.register=!state.register;$('#nameField').classList.toggle('hidden',!state.register);$('#authTitle').textContent=state.register?'Регистрация':'Вход';$('#authSubmit').textContent=state.register?'Создать аккаунт':'Войти';$('#switchText').textContent=state.register?'Уже есть аккаунт?':'Нет аккаунта?';$('#switchAuth').textContent=state.register?'Войти':'Зарегистрироваться'};
$('#authSubmit').onclick=async()=>{try{$('#authMessage').textContent='';const body={email:$('#email').value.trim(),password:$('#password').value};if(state.register)body.full_name=$('#fullName').value.trim();const raw=await api(state.register?'/auth/register':'/auth/login','POST',body),d=Array.isArray(raw)?raw[0]:raw;if(!d?.session_token)throw Error('Сервер не вернул токен сессии');state.token=d.session_token;sessionStorage.setItem('sp_token',state.token);$('#password').value='';await bootstrap()}catch(e){$('#authMessage').textContent=e.message}};
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function setPage(title,sub,actions='',html=''){$('#content').innerHTML=`<header class="top"><div><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div><div class="actions">${actions}</div></header>${html}`}
function rows(key){return Array.isArray(state.data?.[key])?state.data[key]:[]}function courseName(id){return rows('courses').find(x=>x.course_id==id)?.course_name||rows('courses').find(x=>x.course_id==id)?.name||`Курс #${id}`}function periodName(id){const p=rows('academic_periods').find(x=>x.period_id==id);return p?.period_name||p?.name||`Период ${p?.period_number||id}`}
function activePeriod(){return rows('academic_periods').find(x=>x.status==='active')||rows('academic_periods')[0]}function activeResults(){const p=activePeriod();return rows('academic_performance').filter(x=>!p||x.period_id==p.period_id)}
function weighted(rs){let sum=0,w=0;for(const r of rs){if(r.current_grade!=null&&+r.credits>0){sum+=+r.current_grade*+r.credits;w+=+r.credits}}return w?sum/w:null}

function dashboard(){const rs=activeResults(),avg=weighted(rs),credits=rs.reduce((s,x)=>s+(+x.credits||0),0),p=activePeriod();setPage(`С возвращением, ${nameOf().split(' ')[0]}`,`Просмотрите сохранённые данные и создайте прозрачный иллюстративный прогноз.`,`<button class="btn" onclick="makePrediction()">Создать прогноз</button>`,`<div class="grid"><div class="card span3"><div class="eyebrow">Текущий средний</div><div class="metric">${avg==null?'—':avg.toFixed(1)}</div><div class="sub">Взвешено по кредитам</div></div><div class="card span3"><div class="eyebrow">Предметы</div><div class="metric">${rs.length}</div><div class="sub">Сохранённых записей</div></div><div class="card span3"><div class="eyebrow">Кредиты</div><div class="metric">${credits}</div><div class="sub">За текущий период</div></div><div class="card span3"><div class="eyebrow">Прогнозы</div><div class="metric">${rows('predictions').length}</div><div class="sub">История расчётов</div></div><div class="card span8"><h2>Текущие академические результаты</h2><p class="sub">${esc(periodName(p?.period_id))} · сохранённые данные, не прогноз</p>${resultCards(rs.slice(0,6))}</div><div class="card span4"><h2>Контекст обучения</h2><p class="notice">Данные привязаны к вашему аккаунту, учебной программе, году и периоду.</p><p><b>Учебный календарь:</b> ${esc(rows('academic_settings')[0]?.calendar_type||'не задан')}</p><p><b>Статус периода:</b> <span class="pill">${esc(p?.status||'нет')}</span></p><button class="btn secondary wide" onclick="go('academics')">Открыть все данные</button></div></div>`)}

function academics(){const periods=rows('academic_periods'),selected=window.selectedPeriod||activePeriod()?.period_id,rs=rows('academic_performance').filter(x=>!selected||x.period_id==selected);setPage('Мои академические данные','Полный раздел для просмотра и редактирования записей, связанных с вашим аккаунтом.',`<button class="btn secondary" onclick="refresh()">Обновить</button><button class="btn" onclick="subjectModal()">Добавить предмет</button>`,`<div class="card"><div class="toolbar"><div class="field"><label>Учебный период</label><select class="input" onchange="window.selectedPeriod=+this.value;academics()">${periods.map(p=>`<option value="${p.period_id}" ${p.period_id==selected?'selected':''}>${esc(periodName(p.period_id))}</option>`).join('')}</select></div><span class="pill">${rs.length} предметов</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Предмет</th><th>Кредиты</th><th>Текущая оценка</th><th>Посещаемость</th><th>Занятия</th><th>Действия</th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${esc(courseName(r.course_id))}</b></td><td>${esc(r.credits??'—')}</td><td><span class="pill">${esc(r.current_grade??'—')}</span></td><td>${esc(r.attendance_percentage??'—')}${r.attendance_percentage!=null?'%':''}</td><td>${esc(r.lessons_attended??'—')} / ${esc(r.lessons_held??r.lessons_planned??'—')}</td><td><button class="btn secondary" onclick='subjectModal(${JSON.stringify(r)})'>Изменить</button> <button class="btn danger" onclick="removeRecord(${r.performance_id})">Удалить</button></td></tr>`).join('')}</tbody></table>${rs.length?'':'<div class="empty">В этом периоде пока нет записей.</div>'}</div></div><div class="grid" style="margin-top:18px"><div class="card span4"><h3>Учебная программа</h3><p class="sub">${esc(rows('study_programs')[0]?.institution_name||rows('students')[0]?.institution||'Не указано')}</p><div class="metric">${esc(rows('study_programs')[0]?.duration_years||'—')}</div><span class="sub">лет обучения</span></div><div class="card span4"><h3>Учебные годы</h3><div class="metric">${rows('academic_years').length}</div><span class="sub">связанных записей</span></div><div class="card span4"><h3>Оценочные компоненты</h3><div class="metric">${rows('assessment_components').length}</div><span class="sub">экзамены, задания и контрольные</span></div></div>`)}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function subjectModal(r={}){const p=r.period_id||activePeriod()?.period_id;modal(r.performance_id?'Изменить запись':'Добавить предмет',`<div class="field"><label>Предмет</label><select id="mCourse" class="input">${rows('courses').map(c=>`<option value="${c.course_id}" ${c.course_id==r.course_id?'selected':''}>${esc(courseName(c.course_id))}</option>`).join('')}</select></div><div class="field"><label>Период</label><select id="mPeriod" class="input">${rows('academic_periods').map(x=>`<option value="${x.period_id}" ${x.period_id==p?'selected':''}>${esc(periodName(x.period_id))}</option>`).join('')}</select></div><div class="grid"><div class="field span4"><label>Кредиты</label><input id="mCredits" class="input" type="number" min="0" step=".5" value="${esc(r.credits??'')}"></div><div class="field span4"><label>Оценка</label><input id="mGrade" class="input" type="number" min="0" max="100" step=".1" value="${esc(r.current_grade??'')}"></div><div class="field span4"><label>Последняя работа</label><input id="mRecent" class="input" type="number" min="0" max="100" step=".1" value="${esc(r.recent_assessment_score??'')}"></div><div class="field span4"><label>Всего занятий</label><input id="mHeld" class="input" type="number" min="0" value="${esc(r.lessons_held??'')}"></div><div class="field span4"><label>Посещено</label><input id="mAttended" class="input" type="number" min="0" value="${esc(r.lessons_attended??'')}"></div></div><button class="btn wide" onclick="saveSubject(${r.performance_id||'null'})">Сохранить</button><div id="modalMsg" class="message"></div>`)}
async function saveSubject(id){const val=x=>$(x).value===''?null:+$(x).value,data={course_id:+$('#mCourse').value,period_id:+$('#mPeriod').value,credits:val('#mCredits'),current_grade:val('#mGrade'),recent_assessment_score:val('#mRecent'),lessons_held:val('#mHeld'),lessons_attended:val('#mAttended')};try{await api('/tables/academic_performance'+(id?'/'+id:''),id?'PATCH':'POST',{data});closeModal();await refresh()}catch(e){$('#modalMsg').textContent=e.message}}
async function removeRecord(id){if(!confirm('Удалить эту академическую запись?'))return;try{await api(`/tables/academic_performance/${id}?confirm=true`,'DELETE');await refresh()}catch(e){alert(e.message)}}
async function refresh(){state.data=await api('/data');render()}
function assistant(){setPage('Академический помощник','Один интерфейс — два режима: подключаемый ИИ и локальные функции без ИИ.','',`<div class="chat-layout"><div class="card chat-side"><h3>Режим</h3><button class="choice ${state.assistantMode==='basic'?'active':''}" onclick="mode('basic')"><b>Без ИИ</b><div class="sub">Расчёт, поиск и сводки локально</div></button><button class="choice ${state.assistantMode==='ai'?'active':''}" onclick="mode('ai')"><b>ИИ-помощник</b><div class="sub">Последовательные запросы через настроенную модель</div></button><p class="sub" style="margin-top:16px">Помощник видит только данные текущего аккаунта. Запись через ИИ требует подтверждения.</p></div><div class="card"><div id="messages" class="messages">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.who}">${esc(m.text)}</div>`).join(''):`<div class="bubble bot">${state.assistantMode==='basic'?'Я работаю без внешней модели. Могу показать средний балл, посещаемость, предметы, кредиты, выполнить прогноз или открыть калькулятор.':'Опишите задачу обычным языком. Если ИИ предложит изменить данные, я сначала попрошу подтверждение.'}</div>`}</div><div class="quick">${['Покажи средний балл','Какая посещаемость?','Сколько у меня кредитов?','Сделай прогноз'].map(x=>`<button onclick="ask('${x}')">${x}</button>`).join('')}</div><div class="composer"><textarea id="prompt" class="input" placeholder="Например: покажи оценки и затем сделай прогноз"></textarea><button class="btn" onclick="ask()">Отправить</button></div></div></div>`);setTimeout(()=>{const m=$('#messages');if(m)m.scrollTop=m.scrollHeight})}
function mode(m){state.assistantMode=m;state.messages=[];assistant()}
async function ask(q){const input=$('#prompt'),text=q||(input?.value||'').trim();if(!text)return;state.messages.push({who:'user',text});if(input)input.value='';state.messages.push({who:'bot',text:'Выполняю…'});assistant();try{const answer=state.assistantMode==='ai'?await aiAsk(text):await basicAsk(text);state.messages[state.messages.length-1]={who:'bot',text:answer}}catch(e){state.messages[state.messages.length-1]={who:'bot',text:'Не удалось выполнить: '+e.message}}assistant()}
async function basicAsk(text){const t=text.toLowerCase(),rs=activeResults(),avg=weighted(rs);if(/прогноз/.test(t)){const r=await api('/predict','POST',{period_id:activePeriod().period_id,level:'period',save:false});return `Иллюстративный прогноз на текущий период: ${r.average??'нет данных'}. Метод: ${r.method||'консервативная базовая модель'}.`}if(/посещ/.test(t)){let held=0,att=0;rs.forEach(x=>{held+=+x.lessons_held||0;att+=+x.lessons_attended||0});return held?`Посещено ${att} из ${held} занятий — ${(att/held*100).toFixed(1)}%.`:'Для расчёта посещаемости пока недостаточно данных.'}if(/кредит/.test(t))return `В текущем периоде: ${rs.reduce((s,x)=>s+(+x.credits||0),0)} кредитов.`;if(/средн|оцен|балл/.test(t))return avg==null?'Нет оценок для расчёта.':`Средний балл за текущий период: ${avg.toFixed(1)}. Предметов: ${rs.length}.`;if(/предмет|курс/.test(t))return rs.length?rs.map(x=>`${courseName(x.course_id)} — ${x.current_grade??'без оценки'}`).join('\n'):'Предметов пока нет.';if(/кальк/.test(t)){go('calculator');return 'Открыл академический калькулятор.'}return 'Без ИИ я понимаю команды о среднем балле, оценках, предметах, кредитах, посещаемости, прогнозе и калькуляторе.'}
async function aiAsk(text){const d=await api('/ai/chat','POST',{message:text});if(d.status==='confirmation_required'){window.pendingConfirmation=d.confirmation_token;return `ИИ выполнил чтение и предложил ${d.proposed_actions.length} изменение(я). Проверьте предложение и подтвердите кнопкой в окне.\n`+JSON.stringify(d.proposed_actions,null,2)}return formatAI(d)}function formatAI(d){return (d.results||[]).map(x=>x.status==='ok'?(x.result?.text||JSON.stringify(x.result,null,2)):`Ошибка: ${x.detail||x.status}`).join('\n\n')||'Запрос выполнен.'}
function calculator(){setPage('Академический калькулятор','Расчёт без ИИ: средний балл, GPA и посещаемость — вручную или по сохранённым данным.',`<button class="btn secondary" onclick="loadSavedCalc()">Взять текущие данные</button>`,`<div class="grid"><div class="card span8"><div class="toolbar"><div class="field"><label>Учебный календарь</label><select id="calcCalendar" class="input"><option value="trimester">Триместр</option><option value="semester">Семестр</option><option value="quarter">Четверть</option><option value="annual">Год</option><option value="other">Другой</option></select></div></div><h3>Оценки и кредиты</h3><div id="calcRows" class="calc-rows"></div><button class="btn secondary" style="margin-top:10px" onclick="addCalcRow()">+ Добавить строку</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Посещаемость</h3><div class="grid"><div class="field span4"><label>Всего занятий</label><input id="lessonsTotal" class="input" type="number" min="0"></div><div class="field span4"><label>Посещено</label><input id="lessonsAttended" class="input" type="number" min="0"></div><div class="field span4"><label>Уважительные пропуски</label><input id="lessonsExcused" class="input" type="number" min="0" value="0"></div></div><button class="btn wide" onclick="runCalc()">Рассчитать</button></div><div id="calcResult" class="card span4 result"><div class="eyebrow" style="color:#b8e8e3">Результат</div><div class="metric">—</div><p>Введите данные или загрузите их из таблицы.</p></div></div>`);addCalcRow();addCalcRow()}
function addCalcRow(v={}){const d=document.createElement('div');d.className='calc-row';d.innerHTML=`<input class="input cName" placeholder="Предмет" value="${esc(v.name||'')}"><input class="input cGrade" type="number" placeholder="Оценка" value="${esc(v.grade??'')}"><input class="input cCredits" type="number" placeholder="Кредиты" value="${esc(v.credits??'')}"><button class="icon-btn" onclick="this.parentElement.remove()">×</button>`;$('#calcRows').appendChild(d)}
function loadSavedCalc(){$('#calcRows').innerHTML='';activeResults().forEach(x=>addCalcRow({name:courseName(x.course_id),grade:x.current_grade,credits:x.credits}));const held=activeResults().reduce((s,x)=>s+(+x.lessons_held||0),0),att=activeResults().reduce((s,x)=>s+(+x.lessons_attended||0),0);$('#lessonsTotal').value=held||'';$('#lessonsAttended').value=att||'';const cal=rows('academic_settings').find(x=>x.settings_id==activePeriod()?.settings_id)?.calendar_type;if(cal&&[...$('#calcCalendar').options].some(x=>x.value===cal))$('#calcCalendar').value=cal}
async function runCalc(){try{const items=[...document.querySelectorAll('.calc-row')].map(r=>({grade:+r.querySelector('.cGrade').value,credits:+r.querySelector('.cCredits').value})).filter(x=>Number.isFinite(x.grade)&&Number.isFinite(x.credits));const d=await api('/calculate','POST',{calendar:$('#calcCalendar').value,items});const total=+$('#lessonsTotal').value||0,att=+$('#lessonsAttended').value||0,exc=+$('#lessonsExcused').value||0;if(att>total||exc>total-att)throw Error('Проверьте количество посещённых и пропущенных занятий');const rate=total?att/total*100:null;$('#calcResult').innerHTML=`<div class="eyebrow" style="color:#b8e8e3">Средний балл</div><div class="metric">${d.average}</div><p><b>GPA:</b> ${d.gpa??'нужна шкала GPA'}</p><p><b>Посещаемость:</b> ${rate==null?'—':rate.toFixed(1)+'%'}</p><p><b>Занятий:</b> ${att} из ${total}${exc?' · уважительно '+exc:''}</p>`}catch(e){$('#calcResult').innerHTML=`<div class="eyebrow" style="color:#ffd2d2">Ошибка</div><p>${esc(e.message)}</p>`}}
function history(){const ps=rows('predictions');setPage('История прогнозов','Сохранённые снимки расчётов и их фактический контекст.','',`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Уровень</th><th>Период</th><th>Прогноз</th><th>Метод</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc((p.prediction_date||p.created_at||'—').toString().slice(0,10))}</td><td>${esc(p.forecast_level||'period')}</td><td>${esc(periodName(p.period_id))}</td><td><span class="pill">${esc(p.predicted_grade??p.predicted_value??p.result_snapshot?.average??'—')}</span></td><td>${esc(p.prediction_method||p.result_snapshot?.method||'—')}</td></tr>`).join('')}</tbody></table>${ps.length?'':'<div class="empty">Пока нет сохранённых прогнозов.</div>'}</div></div>`)}
async function makePrediction(){const p=activePeriod();if(!p)return alert('Сначала добавьте активный учебный период');try{const r=await api('/predict','POST',{period_id:p.period_id,level:'period',save:true});modal('Иллюстративный прогноз',`<div class="notice">Это прозрачная базовая оценка, а не обученная модель и не гарантия результата.</div><div class="metric">${esc(r.average??'—')}</div><p><b>Метод:</b> ${esc(r.method)}</p><p class="sub">${esc((r.signals||[]).join(' · '))}</p><button class="btn wide" onclick="closeModal();refresh()">Готово</button>`)}catch(e){alert(e.message)}}
function admin(){if(state.me?.role!=='admin')return go('dashboard');setPage('Режим администратора','Демонстрационный просмотр данных по студентам. Пароли и закрытые таблицы недоступны.','',`<div class="card"><div class="toolbar"><div class="field"><label>Таблица</label><select id="adminEntity" class="input"><option>students</option><option>academic_performance</option><option>academic_periods</option><option>academic_years</option><option>study_programs</option><option>predictions</option><option>courses</option></select></div><div class="field"><label>Поиск</label><input id="adminQuery" class="input" placeholder="Имя или значение"></div><button class="btn" onclick="adminSearch()">Найти</button></div><div id="adminResults" class="empty">Выберите таблицу и выполните поиск.</div></div>`)}
async function adminSearch(){const box=$('#adminResults');box.textContent='Загрузка…';try{const d=await api(`/admin/tables/${encodeURIComponent($('#adminEntity').value)}?q=${encodeURIComponent($('#adminQuery').value)}&limit=100`);const items=d.items||d||[];box.className='table-wrap';box.innerHTML=items.length?jsonTable(items):'<div class="empty">Ничего не найдено.</div>'}catch(e){box.className='empty danger-text';box.textContent=e.message}}function jsonTable(items){const keys=[...new Set(items.flatMap(Object.keys))].slice(0,9);return `<table class="table"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${keys.map(k=>`<td>${esc(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const accentPresets=[['Blue','#4F6F8F'],['Purple','#76658A'],['Violet','#806A91'],['Pink','#9B6577'],['Red','#A65D57'],['Orange','#A86F45'],['Yellow','#9A7B32'],['Green','#5F7F62'],['Teal','#4F8078'],['Cyan','#4F7F8A']];
function settings(){const hue=hexHue(state.prefs.accent_color);setPage('Настройки','Профиль, оформление и сеанс приложения.',state.me?.role==='admin'?'<a class="btn ghost" href="/admin">Настройка ИИ-ключа</a>':'',`<div class="grid"><div class="card span8"><section class="settings-section"><h2>Язык</h2><p class="sub">Выбор сохраняется в вашем профиле.</p><div class="field"><label>Язык интерфейса</label><select class="input" onchange="setLanguage(this.value)"><option value="en" ${state.prefs.language==='en'?'selected':''}>English</option><option value="kk" ${state.prefs.language==='kk'?'selected':''}>Kazakh</option><option value="ru" ${state.prefs.language==='ru'?'selected':''}>Russian</option></select></div></section><section class="settings-section"><h2>Внешний вид</h2><p class="sub">Настройте тему и основной акцентный цвет интерфейса.</p><h3>Режим отображения</h3><div class="appearance-grid">${[['light','Светлый'],['dark','Тёмный'],['reading','Режим чтения']].map(([v,n])=>`<button class="mode-card ${state.prefs.display_mode===v?'active':''}" onclick="chooseTheme('${v}')"><div class="mode-preview ${v}"></div><b>${n}</b></button>`).join('')}</div><p class="sub" style="margin-top:10px">Режим чтения использует тёплые поверхности с низким контрастом.</p></section><section class="settings-section"><h2>Акцентный цвет</h2><p class="sub">Выберите готовый цвет или создайте собственный.</p><div class="settings-tabs"><button class="${state.accentTab==='preset'?'active':''}" onclick="accentTab('preset')">Готовые цвета</button><button class="${state.accentTab==='custom'?'active':''}" onclick="accentTab('custom')">Свой цвет</button></div>${state.accentTab==='preset'?`<div class="accent-grid">${accentPresets.map(([n,c])=>`<button class="accent-card ${state.prefs.accent_color===c?'active':''}" onclick="setAccent('${c}')"><span class="swatch" style="background:${c}">${state.prefs.accent_color===c?'✓':''}</span><span>${n}</span></button>`).join('')}</div>`:`<div><h3>Пользовательский оттенок</h3><p class="sub">Изменяйте оттенок — интерфейс обновляется сразу.</p><div class="hue-preview" id="huePreview">${esc(state.prefs.accent_color)}</div><div class="field"><label>Custom hue</label><input class="range" type="range" min="0" max="359" value="${hue}" oninput="customHue(this.value)"></div><div style="display:flex;justify-content:space-between" class="sub"><span>0°</span><span>120°</span><span>240°</span><span>359°</span></div><button class="btn secondary" style="margin-top:14px" onclick="resetPrefs()">Сбросить к стандартному</button></div>`}</section><button class="btn wide" onclick="savePreferences()">Сохранить настройки</button><div id="appearanceMsg" class="message"></div></div><div class="span4"><div class="card" style="margin-bottom:18px"><h2>Профиль</h2><div class="field"><label>Имя</label><input id="setName" class="input" value="${esc(nameOf())}"></div><div class="field"><label>Группа</label><input id="setGroup" class="input" value="${esc(rows('students')[0]?.group_name||'')}"></div><button class="btn wide" onclick="saveProfile()">Сохранить профиль</button><div id="profileMsg" class="message"></div></div><div class="card"><h2>Сеанс</h2><p class="sub">Токен хранится только в пределах этой вкладки браузера и удаляется при выходе.</p><button class="btn danger wide" onclick="logout()">Выйти</button><p style="margin-top:18px"><a href="/docs">Документация API</a></p></div></div></div>`)}
function chooseTheme(v){state.prefs.display_mode=v;applyAppearance();render()}function setAccent(v){state.prefs.accent_color=validAccent(v);applyAppearance();render()}function accentTab(v){state.accentTab=v;render()}function setLanguage(v){state.prefs.language=v;applyAppearance();render()}function customHue(v){state.prefs.accent_color=hueToHex(+v);applyAppearance();const p=$('#huePreview');if(p)p.textContent=state.prefs.accent_color}function resetPrefs(){state.prefs={...DEFAULT_PREFS};applyAppearance();render()}
async function savePreferences(){try{await api('/tables/user_preferences','POST',{data:{language:state.prefs.language,display_mode:state.prefs.display_mode,accent_color:state.prefs.accent_color}});const m=$('#appearanceMsg');m.style.color='var(--accent)';m.textContent='Настройки сохранены'}catch(e){$('#appearanceMsg').textContent=e.message}}
async function saveProfile(){try{await api(`/tables/students/${state.me.student_id}`,'PATCH',{data:{full_name:$('#setName').value.trim(),group_name:$('#setGroup').value.trim()||null}});$('#profileMsg').style.color='var(--accent)';$('#profileMsg').textContent='Сохранено';await refresh()}catch(e){$('#profileMsg').textContent=e.message}}
async function logout(){try{await api('/auth/logout','POST')}catch{}sessionStorage.removeItem('sp_token');state.token='';location.reload()}
bootstrap();
</script></body></html>
