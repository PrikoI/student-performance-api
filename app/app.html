<section id="auth" class="auth hidden"><div class="auth-card"><div class="brand"><img class="brand-logo" src="/logo.png" alt="Perfecta"><div><b>Perfecta</b><small>Student Performance</small></div></div><h1 id="authTitle">Sign in</h1><p class="sub" id="authSub">Access your academic data and analysis tools.</p><div id="nameField" class="field hidden"><label id="nameLabel">Student name</label><input id="fullName" class="input" autocomplete="name"></div><div id="usernameField" class="field hidden"><label id="usernameLabel">Username</label><input id="username" class="input" autocomplete="username" maxlength="30"><small id="usernameFeedback" class="sub"></small></div><div id="identifierField" class="field"><label id="identifierLabel">Email or username</label><input id="email" class="input" type="text" autocomplete="username"></div><div id="passwordField" class="field"><label id="passwordLabel">Password</label><div class="password-wrap"><input id="password" class="input" type="password" autocomplete="current-password"><button type="button" class="password-toggle" aria-label="Show password" title="Show password" onclick="togglePassword('password',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button></div><small id="passwordHint" class="sub hidden">At least 8 characters.</small></div><div id="rememberField" class="field"><label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input id="rememberMe" type="checkbox"><span id="rememberLabel">Keep me signed in</span></label></div><div id="consentField" class="field hidden"><label style="display:flex;gap:10px;align-items:flex-start"><input id="agreementAccepted" type="checkbox" style="margin-top:4px"><span><span id="consentBefore">I have read and accept </span><button id="agreementLink" type="button" class="link" onclick="showAgreementPreview()">the user agreement</button><span id="consentAfter">, <script>
// A separate bootstrap watchdog lives at the very start of the script. If a
// runtime request stalls, the user gets an actionable screen instead of an
// endless spinner. Syntax integrity is also checked before every deployment.
globalThis.__perfectaBootWatchdog=setTimeout(()=>{
 const boot=document.getElementById('boot'),auth=document.getElementById('auth');
 if(boot&&!boot.classList.contains('hidden')){
  boot.classList.add('hidden');
  if(auth)auth.classList.remove('hidden');
  const message=document.getElementById('authMessage');
  if(message)message.textContent='Perfecta не смогла завершить загрузку. Обновите страницу или повторите вход.';
 }
},20000);
let chatPollTimer=null;
function startChatPolling(){if(chatPollTimer)clearInterval(chatPollTimer);if(state.view!=='assistant'||!state.currentChatId)return;chatPollTimer=setInterval(syncCurrentChat,3000)}
function chatMessagesWithPending(d){const messages=(d.messages||[]).map(m=>({who:m.role==='assistant'?'bot':'user',text:m.content})),waiting=d.session?.control_mode==='operator'&&messages.at(-1)?.who==='user';if(waiting)messages.push({who:'bot',text:chatCopy().running,pending:true});return messages}
async function syncCurrentChat(){if(state.view!=='assistant'||!state.currentChatId||window.chatRequestInFlight||window.chatSyncInFlight)return;window.chatSyncInFlight=true;const revision=window.chatRevision||0;try{const requestedId=state.currentChatId,d=await api('/ai/sessions/'+requestedId);if(state.view!=='assistant'||state.currentChatId!==requestedId||window.chatRequestInFlight||revision!==(window.chatRevision||0))return;const display=chatMessagesWithPending(d),current=state.messages;if(display.length!==current.length||display.some((m,i)=>m.who!==current[i]?.who||m.text!==current[i]?.text)){state.messages=display;window.operatorPending=display.at(-1)?.pending===true;paintChatMessages()}}catch(e){console.warn('Chat refresh failed',e)}finally{window.chatSyncInFlight=false}}

let adminChatState={items:[],selected:null};
function adminChats(){if(state.me?.role!=='admin')return go('dashboard');const c=localizedSection('adminChats');setPage(c.title,c.subtitle,'',`<div class="chat-layout" style="margin-top:16px"><div class="card"><button class="btn secondary wide" onclick="loadAdminChats()">${esc(tr('common.refresh',{defaultValue:'Refresh'}))}</button><div id="adminChatList" class="chat-session-list"><p class="sub">${esc(tr('common.loading',{defaultValue:'Loading…'}))}</p></div></div><div class="card" id="adminChatPanel"><div class="empty">${esc(c.select)}</div></div></div>`);loadAdminChats()}
async function loadAdminChats(){try{adminChatState.items=await api('/admin/ai/chats');const box=$('#adminChatList');if(box)box.innerHTML=adminChatState.items.length?adminChatState.items.map(s=>`<button class="chat-session-main" style="width:100%;margin:6px 0" onclick="openAdminChat(${s.session_id})"><b>${esc(s.full_name)}</b><br><span class="sub">${esc(s.title)} · ${esc(userDate(s.updated_at))}</span></button>`).join(''):'<p class="sub">Чатов пока none.</p>'}catch(e){const box=$('#adminChatList');if(box)box.innerHTML=`<div class="danger-text">${esc(e.message)}</div>`}}
async function openAdminChat(id){try{adminChatState.selected=null;adminChatState.signature='';adminChatState.draft='';await refreshAdminChat(id,true);if(window.adminChatTimer)clearInterval(window.adminChatTimer);window.adminChatTimer=setInterval(()=>refreshAdminChat(id,false),3000)}catch(e){const p=$('#adminChatPanel');if(p)p.innerHTML=`<div class="danger-text">${esc(e.message)}</div>`}}
function adminChatSignature(d){return JSON.stringify([d?.session?.control_mode,...(d?.messages||[]).map(m=>[m.message_id,m.role,m.author_type,m.content])])}
async function refreshAdminChat(id,force=false){if(state.view!=='admin_chats'||window.adminChatRefreshInFlight)return;window.adminChatRefreshInFlight=true;try{const d=await api('/admin/ai/chats/'+id),signature=adminChatSignature(d);if(force||signature!==adminChatState.signature){adminChatState.selected=d;adminChatState.signature=signature;renderAdminChatPanel()}}catch(e){if(force)throw e}finally{window.adminChatRefreshInFlight=false}}

function predictionHtml(r){const t=forecastUi(),subjects=r.subjects||[],ref=r.reference_model||{},datasets=ref.datasets||[],coverage=r.coverage||{},confidence=t[r.confidence]||tr('forecastDetails.'+r.confidence,{defaultValue:r.confidence||'—'});const coverageBits=[String(coverage.current_subjects??subjects.length)];if(coverage.observed_periods!=null)coverageBits.push(t.observed+': '+coverage.observed_periods);if(coverage.required_periods!=null)coverageBits.push(t.required+': '+coverage.required_periods);return `<div class="notice"><b>${esc(t.guarantee)}</b><br>${esc(t.confidence)}: ${esc(confidence)}.</div><div class="metric">${esc(Number(r.average).toFixed(2))}%</div>${forecastConversion(r)?`<div class="forecast-conversion"><span>${esc(forecastUi().conversionLabel)}</span><b>${esc(forecastConversion(r))}</b></div>`:'' }<div class="forecast-summary"><span><b>${esc(t.level)}:</b> ${esc(forecastLevelLabel(r.level))}</span><span><b>${esc(t.method)}:</b> ${esc(forecastMethodLabel(r.effective_method_version||r.method_version))}</span><span><b>${esc(t.coverage)}:</b> ${esc(coverageBits.join(' · '))}</span></div>${datasets.length?`<p class="sub"><b>${esc(t.history)}:</b> ${datasets.map(x=>esc(x.title)+' ('+esc(x.sample_count)+' '+esc(t.observations)+')').join(' · ')}. ${esc(t.weight)}: ${Math.round((ref.blend_weight||0)*100)}%.</p>`:''}<div class="details-grid forecast-subjects">${subjects.map(s=>{const signals=(s.signals||[]).map(forecastSignalLabel);return `<div class="details-row"><b>${esc(courseLabel(s.course_id))}</b><span class="pill forecast-grade">${esc(Number(s.grade).toFixed(2))}%${s.converted_grade!=null?' · '+esc(s.converted_grade):''}${s.converted_points!=null?' · '+esc(Number(s.converted_points).toFixed(2))+'/4.0':''}</span><p class="sub">${esc(t.source)}: ${s.current_grade==null?'—':esc(Number(s.current_grade).toFixed(1))}${(s.workload_value??s.credits)!=null?' · '+esc(s.workload_value??s.credits)+' '+esc(({credits:t.credits,academic_hours:t.hours,lessons:t.lessons})[s.workload_unit||'credits']||s.workload_unit):''}</p>${signals.length?`<p class="danger-text"><b>${esc(t.risk)}:</b> ${esc(signals.join(' · '))}</p>`:`<p class="sub">${esc(t.none)}</p>`}${(s.exams||[]).map(e=>`<p>${esc(e.name)}: ${e.estimated_grade==null?esc(tr('academicEntry.examPending',{defaultValue:'Not enough graded work yet'})):esc(Number(e.estimated_grade).toFixed(1)+'%')}</p>`).join('')}</div>`}).join('')}</div>`}
const predictionHtmlBase=predictionHtml;
predictionHtml=function(r){const html=predictionHtmlBase(r),risk=r.risk_summary||{},ranges=(r.subjects||[]).filter(x=>x.forecast_range);if(risk.average_probability==null&&!ranges.length)return html;const riskText=risk.average_probability==null?'':`Вероятность результата ниже порога: ${risk.average_probability}%. Subjectов с повышенным риском: ${risk.high_risk_subjects||0}.`;const rangeText=ranges.length?`Ориентировочный диапазон рассчитан для ${ranges.length} предметов и показан как зона возможного результата, а не гарантия.`:'';return html.replace('<div class="details-grid forecast-subjects">',`<div class="forecast-insight"><b>Что показывает прогноз</b><p>${esc(riskText)}</p><p class="sub">${esc(rangeText)}</p></div><div class="details-grid forecast-subjects">`)}
const FORECAST_FORM=localizedBundle('forecastModal');
function forecastForm(){return FORECAST_FORM[state.prefs.language]||FORECAST_FORM.en}
const FORECAST_LOADING=localizedBundle('forecastLoading');
let forecastLoadingTimer=null;
function hideForecastLoading(){if(forecastLoadingTimer){clearInterval(forecastLoadingTimer);forecastLoadingTimer=null}$('#forecastLoading')?.remove()}
function showForecastLoading(){const t=FORECAST_LOADING[state.prefs.language]||FORECAST_LOADING.en;hideForecastLoading();document.body.insertAdjacentHTML('beforeend',`<div id="forecastLoading" class="forecast-loading-overlay" role="status" aria-live="polite"><div class="forecast-loading-card"><img class="forecast-loading-logo" src="/logo.png" alt="Perfecta"><div class="forecast-loading-ring" aria-hidden="true"></div><h2>${esc(t.title)}</h2><p id="forecastLoadingText">${esc(t.steps[0])}</p><span class="forecast-loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></div></div>`);let i=0;forecastLoadingTimer=setInterval(()=>{i=(i+1)%t.steps.length;const el=$('#forecastLoadingText');if(el)el.textContent=t.steps[i]},1800)}
function hasAdaptiveEvidence(){return rows('assessment_results').some(x=>x.status==='graded'&&x.score!=null)}
function makePrediction(){const p=activePeriod(),t=forecastForm(),adaptive=hasAdaptiveEvidence();if(!p)return alert(t.noPeriod||'Сначала добавьте активный учебный период');const adaptiveHint=t.adaptiveUnavailable;modal(t.title,`<div class="field"><label>${esc(t.level)}</label><select id="forecastLevel" class="input"><option value="next_period" selected>${esc(t.next)}</option><option value="period">${esc(t.period)}</option><option value="year">${esc(t.year)}</option><option value="program">${esc(t.program)}</option></select></div><div class="field"><label>${esc(t.method)}</label><select id="forecastMethod" class="input"><option value="baseline">${esc(t.baseline)}</option><option value="adaptive" ${adaptive?'':'disabled'}>${esc(t.adaptive)}</option></select></div>${adaptive?'':`<p class="notice">${esc(adaptiveHint)}</p>`}<p class="sub">${esc(t.help)}</p><button class="btn wide" onclick="runPrediction()">${esc(t.run)}</button><div id="modalMsg" class="message"></div>`)}
async function runPrediction(){const p=activePeriod(),level=$('#forecastLevel').value,method=$('#forecastMethod').value,button=$('#modalBody .btn');if(button)button.disabled=true;$('#modalMsg').textContent='';showForecastLoading();try{const r=await api('/predict','POST',{period_id:p.period_id,level,method,save:true},60000);await refresh();$('#modalBody').innerHTML=predictionHtml(r)+`<button class="btn wide" onclick="closeModal()">${esc(forecastForm().done)}</button>`}catch(e){$('#modalMsg').textContent=e.message;if(button)button.disabled=false}finally{hideForecastLoading()}}
function admin(){if(state.me?.role!=='admin')return go('dashboard');setPage('Admin Mode','Student directory, ready-made queries, and safe academic data browsing.','',`<div class="grid"><div class="card span12"><div class="actions"><div style="flex:1"><h2>Students</h2><p class="sub">Choose a ready-made query or open a specific student profile.</p></div><div class="field" style="margin:0;min-width:240px"><label>Quick search</label><input id="studentSearch" class="input" placeholder="Name, email, or group" oninput="renderAdminStudents()"></div></div><div class="query-chips"><button data-filter="all" class="active" onclick="adminFilter('all',this)">All students</button><button data-filter="graded" onclick="adminFilter('graded',this)">With grades</button><button data-filter="missing" onclick="adminFilter('missing',this)">Without grades</button><button data-filter="predictions" onclick="adminFilter('predictions',this)">With predictions</button></div><div id="studentDirectory" class="student-directory"><div class="empty">Loading students…</div></div></div><div class="card span7"><h2>Student profile</h2><p class="sub">Grades, periods, and predictions for the selected profile without manual table searches.</p><div id="studentDetails" class="empty">Choose a student from the directory.</div></div><div class="card span5"><h2>Average performance</h2><p class="sub">Only students with the same calendar and grading scale are compared; the main result is shown as a percentage.</p><button class="btn wide" onclick="adminGpa()">Calculate for all students</button><div id="adminGpaResult" class="empty">—</div></div><div class="card span12"><h2>Assessment category templates</h2><p class="sub">The three system templates remain available; administrators can add reusable alternatives for each calendar.</p><button class="btn" onclick="openAdminTemplateEditor()">+ Add template</button><div id="adminCategoryTemplates" class="academic-summary-grid" style="margin-top:16px"><div class="empty">Load async function adminLoadStudents(){try{const [s,r,p,g]=await Promise.all([api('/admin/tables/students?limit=100'),api('/admin/tables/academic_performance?limit=100'),api('/admin/tables/predictions?limit=100'),api('/admin/analytics/comparable-gpa')]);const records=r.items||[],predictions=p.items||[],averages=new Map((g.groups||[]).flatMap(x=>(x.students||[]).map(y=>[y.student_id,y.average_percent])));window.adminStudents=(s.items||[]).filter(x=>x.student_id!==state.me.student_id).map(x=>({...x,records:records.filter(r=>r.student_id===x.student_id).length,predictions:predictions.filter(p=>p.student_id===x.student_id).length,averagePercent:averages.get(x.student_id)}));window.adminStudentFilter='all';if($('#studentDirectory'))renderAdminStudents()}catch(e){const directory=$('#studentDirectory');if(directory)directory.innerHTML=`<div class="danger-text">${esc(e.message)}</div>`}}

function openAdminTemplateEditor(templateId=null){const item=(window.adminCategoryTemplates||[]).find(x=>x.template_id===templateId),categories=item?.categories||[{name:'Assignments',type:'assignment',weight:30},{name:'Midterm',type:'midterm',weight:30},{name:'Final',type:'final',weight:40}];modal(item?'Edit template':'Add template',`<div class="field"><label>Template name</label><input id="adminTemplateName" class="input" maxlength="100" value="${esc(item?.name||'')}"></div><div class="field"><label>Study calendar</label><select id="adminTemplateCalendar" class="input">${['trimester','semester','quarter'].map(x=>`<option value="${x}" ${item?.calendar_type===x?'selected':''}>${esc(localizedValue(x,'calendar'))}</option>`).join('')}</select></div><div id="adminTemplateRows">${categories.map(adminTemplateRow).join('')}</div><button class="btn ghost" onclick="$('#adminTemplateRows').insertAdjacentHTML('beforeend',adminTemplateRow({type:'other',weight:0}));updateAdminTemplateTotal()">+ Add category</button><div class="sticky-save"><p id="adminTemplateTotal" class="sub"></p><button class="btn wide" onclick="saveAdminTemplate(${templateId||'null'})">Save</button><div id="modalMsg" class="message"></div></div>`);updateAdminTemplateTotal()}

function chooseTheme(v){state.prefs.display_mode=v;applyAppearance();render()}function setAccent(v){state.accentSource='preset';localStorage.setItem('sp_accent_source','preset');state.prefs.accent_color=validAccent(v);applyAppearance();render()}function accentTab(v){state.accentTab=v;render()}async function setLanguage(v){if(!SUPPORTED_LANGUAGES.has(v))v='en';state.prefs.language=v;if(languageCacheKey())localStorage.setItem(languageCacheKey(),v);await ensureI18n(v);applyAppearance();render();requestAnimationFrame(()=>{render();applyLanguage();applyDataI18n()});try{await api('/tables/user_preferences','POST',{data:{language:v}})}catch(e){console.warn('Language preference was not saved',e)}}function setAccessibility(key,value){state.prefs[key]=key==='colorblind_mode'?!!value:+value;applyAppearance();const u=$('#uiScaleValue');if(u)u.textContent=state.prefs.ui_scale+'%'}function setCustomColor(hex){if(!/^#[0-9a-f]{6}$/i.test(hex))return;state.accentSource='custom';localStorage.setItem('sp_accent_source','custom');state.prefs.accent_color=hex.toUpperCase();applyAppearance();const p=$('#huePreview'),r=$('#rgbR'),g=$('#rgbG'),b=$('#rgbB');if(p)p.textContent=state.prefs.accent_color;if(r)r.value=parseInt(hex.slice(1,3),16);if(g)g.value=parseInt(hex.slice(3,5),16);if(b)b.value=parseInt(hex.slice(5,7),16)}

async function savePreferences(){try{await api('/tables/user_preferences','POST',{data:{language:state.prefs.language,display_mode:state.prefs.display_mode,accent_color:state.prefs.accent_color}});const m=$('#appearanceMsg');m.style.color='var(--accent)';m.textContent=translateUiText('Settings saved')}catch(e){$('#appearanceMsg').textContent=e.message}}

function academicPeriodContext(){const periods=rows('academic_periods'),years=rows('academic_years'),selected=selectedAcademicPeriod(),year=years.find(x=>x.year_id==selected?.year_id),yearPeriods=periods.filter(x=>!year||x.year_id==year.year_id).sort((a,b)=>(a.period_number||0)-(b.period_number||0));return `<div class="card academic-context"><div class="academic-context-main"><div class="field"><label>${esc(tr('academicWorkspace.workspace.year',{defaultValue:'Academic year'}))}</label><select class="input" onchange="selectAcademicYear(+this.value)">${years.map(x=>`<option value="${x.year_id}" ${x.year_id==selected?.year_id?'selected':''}>${esc(x.year_label||x.year_number)}</option>`).join('')}</select></div><div class="field"><label>${esc(tr('academicWorkspace.workspace.period',{defaultValue:'Study period'}))}</label><select class="input" onchange="switchAcademicPeriod(+this.value)">${yearPeriods.map(x=>`<option value="${x.period_id}" ${x.period_id==selected?.period_id?'selected':''}>${esc(localizedPeriodName(x.period_id))}</option>`).join('')}</select></div></div><div class="actions"><button class="btn ghost" onclick="openPeriodCopy()">${esc(tr('academicWorkspace.workspace.copyPeriod',{defaultValue:'Copy subjects'}))}</button><button class="btn secondary" onclick="window.academicTab='structure';academics()">${esc(tr('academicWorkspace.workspace.manage',{defaultValue:'Manage years and periods'}))}</button></div></div>`}

function calculatedAttendance(r){const held=Number(r.lessons_held),attended=Number(r.lessons_attended),excused=Number(r.lessons_excused||0);if(Number.isFinite(held)&&held>0&&Number.isFinite(attended))return Math.max(0,Math.min(100,(attended+Math.min(excused,Math.max(0,held-attended)))*100/held));return r.attendance==null?null:Number(r.attendance)}
function calculatedSubjectGrade(performanceId){const components=rows('assessment_components').filter(x=>x.performance_id==performanceId),assessments=rows('assessments'),results=rows('assessment_results'),byAssessment=new Map(results.filter(x=>x.status==='graded'&&x.score!=null).map(x=>[String(x.assessment_id),x]));let weighted=0,totalWeight=0,gradedWorks=0,totalWorks=0;for(const c of components){const works=assessments.filter(x=>x.component_id==c.component_id);totalWorks+=works.length;const scores=works.map(w=>{const result=byAssessment.get(String(w.assessment_id));if(!result||!Number(w.maximum_score))return null;gradedWorks++;return Number(result.score)/Number(w.maximum_score)*100}).filter(x=>x!=null);if(scores.length){const average=scores.reduce((a,b)=>a+b,0)/scores.length,weight=Number(c.weight_percent)||0;weighted+=average*weight;totalWeight+=weight}}return {value:totalWeight?weighted/totalWeight:null,gradedWorks,totalWorks,weight:components.reduce((s,x)=>s+(Number(x.weight_percent)||0),0)}}

saveLocalCategoryTemplate=async function(calendar,event){const draft=categoryDraft(),total=draft.reduce((s,x)=>s+x.weight_percent,0),msg=$('#modalMsg');if(!draft.length||draft.some(x=>!x.name||!Number.isFinite(x.weight_percent)||x.weight_percent<0)||Math.abs(total-100)>.001){msg.textContent=tr('academicWorkspace.workspace.weightMustEqual',{defaultValue:'Category weights must add up to 100%.'});return}let field=$('#personalTemplateName');if(!field){const button=event?.target?.closest('button');if(!button)return;button.insertAdjacentHTML('beforebegin',`<label class="field">${esc(tr('academicWorkspace.workspace.templateName',{defaultValue:'Template name'}))}<input id="personalTemplateName" class="input" maxlength="100" autocomplete="off"></label>`);field=$('#personalTemplateName');field.focus();return}const name=field.value.trim();if(!name){field.focus();return}try{await api('/academic/personal-category-templates','POST',{data:{name:name.slice(0,100),calendar_type:calendar,categories:draft.map(x=>({name:x.name,type:x.component_type,weight:x.weight_percent}))}});msg.textContent=tr('academicWorkspace.workspace.templateSaved',{defaultValue:'The template was saved in your account.'});field.remove()}catch(e){msg.textContent=friendlyAcademicError(e.message)}};
requestCourseDeletion=async function(courseId){pendingWrites++;updateRequestProgress();try{const info=await api(`/courses/${courseId}/delete-info`),course=rows('courses').find(x=>x.course_id==courseId),name=course?.course_name||tr('academicWorkspace.workspace.subject',{defaultValue:'subject'});if(info.has_related_data){const details=[`${info.performance_records||0} ${tr('academicWorkspace.workspace.periodRecords',{defaultValue:'period records'})}`,`${info.works||0} ${tr('academicWorkspace.workspace.worksLower',{defaultValue:'works'})}`,`${info.grades||0} ${tr('academicWorkspace.workspace.gradesLower',{defaultValue:'grades'})}`].join(' · ');if(!confirm(tr('academicWorkspace.workspace.deleteCourseWarning',{defaultValue:'Delete “{{name}}” and all its related data? This cannot be undone.\n\n{{details}}',name,details})))return}await api(`/courses/${courseId}`,'DELETE');await refresh();window.academicTab='courses';academics()}catch(e){alert(friendlyAcademicError(e.message))}finally{pendingWrites=Math.max(0,pendingWrites-1);updateRequestProgress()}};
