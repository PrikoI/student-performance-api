<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Student Performance · API</title>
<style>body{font:16px system-ui;background:#0e1728;color:#e9eff8;max-width:760px;margin:50px auto;padding:20px}section{background:#172238;padding:24px;border-radius:16px;margin:20px 0}label{display:block;margin-top:14px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border-radius:8px;border:1px solid #53617b;background:#0e1728;color:inherit}button{background:#167f79;cursor:pointer}small{color:#b3c2da}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#54d4c8}</style>
<h1>Настройка API</h1><p>Панель администратора. Ключ ИИ хранится зашифрованным и не отображается после сохранения.</p>
<section id="login"><h2>Вход</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">Войти</button></section>
<section id="settings" hidden><h2>Подключение ИИ</h2><label>Адрес API<input id="base" value="https://openrouter.ai/api/v1" placeholder="https://provider.example/v1"></label><label>Модель<input id="model" value="openai/gpt-4o-mini" placeholder="Идентификатор модели"></label><label>Ключ<input id="key" type="password" autocomplete="off" placeholder="Оставьте пустым, чтобы сохранить текущий"></label><label><input id="enabled" type="checkbox" style="width:auto"> Включить ИИ</label><button id="save">Сохранить</button><button id="logout">Выйти</button><small>Протокол Chat Completions. Разрешённые провайдеры: OpenAI, OpenRouter, Groq, Google. Числовой прогноз и калькулятор доступны без ключа.</small></section>
<p id="status" role="status"></p><p><a href="/docs">Команды API и проверка запросов</a></p>
<script>
let token="";
const el=id=>document.getElementById(id);
async function request(path,method="GET",body){
 const r=await fetch(path,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
 const data=await r.json();if(!r.ok)throw Error(typeof data.detail==="string"?data.detail:JSON.stringify(data.detail));return data;
}
el("signIn").onclick=async()=>{try{const d=await request("/auth/login","POST",{email:el("email").value,password:el("password").value});token=d.session_token;el("password").value="";const c=await request("/admin/ai");el("base").value=c.base_url||"https://openrouter.ai/api/v1";el("model").value=c.model||"openai/gpt-4o-mini";el("enabled").checked=!!c.enabled;el("login").hidden=true;el("settings").hidden=false;el("status").textContent=c.key_configured?"Ключ уже сохранён":"Введите параметры подключения";}catch(e){token="";el("status").textContent=e.message;}};
el("save").onclick=async()=>{try{const b={base_url:el("base").value,model:el("model").value,enabled:el("enabled").checked};if(el("key").value)b.api_key=el("key").value;await request("/admin/ai","PUT",b);el("key").value="";el("status").textContent="Настройки сохранены";}catch(e){el("status").textContent=e.message;}};
el("logout").onclick=async()=>{try{await request("/auth/logout","POST");}finally{token="";location.reload();}};
</script></html>
